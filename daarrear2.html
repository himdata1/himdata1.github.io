        let rawData = JSON.parse(JSON.stringify(defaultRawData));
        const tbody = document.getElementById('calculatorTableBody');

        function formatIndianCurrency(num) {
            if (isNaN(num)) return num;
            return num.toLocaleString('en-IN');
        }

        // Apply annual increments and synchronize repeating Month + Year instances
        function applyAnnualIncrements(startIndex = 0) {
            const incrementMonth = document.getElementById('incrementMonthSelect').value;
            if (rawData.length === 0) return;

            const applyIncrements = incrementMonth !== "None";

            let monthYearMap = {}; // Tracks basic pay for each unique Month-Year
            let runningBasic = parseFloat(rawData[0]?.basic) || 49300;
            let prevYear = parseInt(rawData[0]?.year) || 2022;
            let prevMonthIdx = monthsList.indexOf(rawData[0]?.month);
            if (prevMonthIdx === -1) prevMonthIdx = 0;

            for (let i = 0; i < rawData.length; i++) {
                let item = rawData[i];
                let itemYear = parseInt(item.year) || 2022;
                let itemMonthIdx = monthsList.indexOf(item.month);
                if (itemMonthIdx === -1) itemMonthIdx = 0;

                let myKey = `${item.month}_${item.year}`;

                if (i === 0) {
                    runningBasic = parseFloat(item.basic) || runningBasic;
                    monthYearMap[myKey] = runningBasic;
                } else {
                    // If this Month+Year has appeared before, inherit its basic pay from its previous instance
                    if (monthYearMap.hasOwnProperty(myKey)) {
                        item.basic = monthYearMap[myKey];
                        runningBasic = item.basic;
                    } else {
                        // Check if an annual increment should apply for new month-years
                        if (applyIncrements && item.month === incrementMonth) {
                            if (itemYear > prevYear || (itemYear === prevYear && itemMonthIdx > prevMonthIdx)) {
                                let increment = Math.round((runningBasic * 0.03) / 100) * 100;
                                runningBasic += increment;
                            }
                        }
                        item.basic = runningBasic;
                        monthYearMap[myKey] = runningBasic;
                    }
                }

                prevYear = itemYear;
                prevMonthIdx = itemMonthIdx;
            }
        }

        // Cascade months and years sequentially starting from startIndex
        function cascadeMonthsAndYears(startIndex) {
            for (let i = startIndex + 1; i < rawData.length; i++) {
                let prevMonth = rawData[i - 1].month;
                let prevYear = parseInt(rawData[i - 1].year) || 2022;
                
                let mIndex = monthsList.indexOf(prevMonth);
                if (mIndex === -1) mIndex = 0;
                
                let nextMIndex = (mIndex + 1) % 12;
                let nextYear = prevYear;
                if (nextMIndex === 0) {
                    nextYear += 1;
                }
                
                rawData[i].month = monthsList[nextMIndex];
                rawData[i].year = nextYear;
            }
        }

        // Cascade non-month field value down to subsequent rows
        function cascadeFieldDown(startIndex, field) {
            const val = rawData[startIndex][field];
            for (let i = startIndex + 1; i < rawData.length; i++) {
                rawData[i][field] = val;
            }
        }

        function deleteRow(index) {
            if (rawData.length <= 1) {
                alert("At least one row must remain.");
                return;
            }
            rawData.splice(index, 1);
            renderTable();
        }

        function updateHeaderPeriod() {
            const headerPeriod = document.getElementById('headerPeriod');
            if (rawData.length > 0) {
                const first = rawData[0];
                const last = rawData[rawData.length - 1];
                headerPeriod.textContent = `(${first.month} ${first.year} to ${last.month} ${last.year})`;
            } else {
                headerPeriod.textContent = '';
            }
        }

        function renderTable() {
            updateHeaderPeriod();
            tbody.innerHTML = '';
            rawData.forEach((item, index) => {
                const tr = document.createElement('tr');
                const isRedRow = item.month === "January" || item.month === "July";
                const bgClass = index % 2 === 0 ? 'bg-white hover:bg-red-50' : 'bg-gray-50 hover:bg-red-50';
                tr.className = `${bgClass} ${isRedRow ? 'text-red-600' : ''}`;
                
                let monthOptions = '';
                monthsList.forEach(m => {
                    const selected = (m === item.month) ? 'selected' : '';
                    monthOptions += `<option value="${m}" ${selected}>${m}</option>`;
                });

                const inputExtra = isRedRow ? 'text-red-600 font-semibold' : '';

                tr.innerHTML = `
                    <td class="p-2 text-center border-r border-gray-200 no-print" style="width: 5%;">
                        <button onclick="deleteRow(${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 rounded transition">&times;</button>
                    </td>
                    <td class="p-2 text-center border-r border-gray-200 font-medium ${inputExtra}" style="width: 6%;">${index + 1}</td>
                    <td class="p-2 border-r border-gray-200" style="width: 13%;">
                        <select class="table-input w-full bg-transparent appearance-none focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 rounded p-1 ${inputExtra}" data-field="month" data-index="${index}">
                            ${monthOptions}
                        </select>
                    </td>
                    <td class="p-2 text-center border-r border-gray-200" style="width: 8%;">
                        <input type="number" value="${item.year}" onfocus="this.select()" class="table-input w-full text-center bg-transparent focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 rounded p-1 ${inputExtra}" data-field="year" data-index="${index}">
                    </td>
                    <td class="p-2 text-center border-r border-gray-200" style="width: 12%;">
                        <input type="number" value="${item.basic}" onfocus="this.select()" class="table-input w-full text-center bg-transparent focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 rounded p-1 ${inputExtra}" data-field="basic" data-index="${index}">
                    </td>
                    <td class="p-2 text-center border-r border-gray-200" style="width: 10%;">
                        <input type="number" value="${item.prevDA}" onfocus="this.select()" class="table-input w-full text-center bg-transparent focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 rounded p-1 ${inputExtra}" data-field="prevDA" data-index="${index}">
                    </td>
                    <td class="p-2 text-center border-r border-gray-200" style="width: 10%;">
                        <input type="number" value="${item.revDA}" onfocus="this.select()" class="table-input w-full text-center bg-transparent focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500 rounded p-1 ${inputExtra}" data-field="revDA" data-index="${index}">
                    </td>
                    <td class="p-2 text-center border-r border-gray-200 font-semibold ${isRedRow ? 'text-red-600' : 'text-blue-800'}" style="width: 14%;" id="totalArrear-${index}">0</td>
                    <td class="p-2 text-center border-r border-gray-200 font-semibold ${isRedRow ? 'text-red-600' : 'text-gray-800'}" style="width: 9%;" id="npsShare-${index}">0</td>
                    <td class="p-2 text-center font-semibold ${isRedRow ? 'text-red-600' : 'text-green-800'}" style="width: 18%;" id="netArrear-${index}">0</td>
                `;
                tbody.appendChild(tr);
            });
            calculateAll();
        }

        function calculateAll() {
            let grandTotalArrear = 0;
            let grandNetArrear = 0;
            let totalNpsAmountSum = 0;

            const headerNpsPct = parseFloat(document.getElementById('headerNpsInput').value) || 0;

            rawData.forEach((item, index) => {
                const basic = parseFloat(item.basic) || 0;
                const prevDA = parseFloat(item.prevDA) || 0;
                const revDA = parseFloat(item.revDA) || 0;
                
                const totalArrear = Math.round(basic * (revDA - prevDA) / 100);
                grandTotalArrear += totalArrear;

                const totalArrearElem = document.getElementById(`totalArrear-${index}`);
                if (totalArrearElem) totalArrearElem.innerText = formatIndianCurrency(totalArrear);

                const npsDeduction = Math.round(totalArrear * headerNpsPct / 100);
                totalNpsAmountSum += npsDeduction;

                const npsShareElem = document.getElementById(`npsShare-${index}`);
                if (npsShareElem) npsShareElem.innerText = formatIndianCurrency(npsDeduction);

                const netArrear = totalArrear - npsDeduction;
                grandNetArrear += netArrear;
                const netArrearElem = document.getElementById(`netArrear-${index}`);
                if (netArrearElem) netArrearElem.innerText = formatIndianCurrency(netArrear);
            });

            document.getElementById('grandTotalArrear').innerText = formatIndianCurrency(grandTotalArrear);
            document.getElementById('footerTotalArrear').innerText = formatIndianCurrency(grandTotalArrear);

            const npsDisplay = formatIndianCurrency(totalNpsAmountSum);
            document.getElementById('grandTotalNps').innerText = npsDisplay;
            document.getElementById('footerTotalNps').innerText = npsDisplay;

            document.getElementById('grandNetArrear').innerText = formatIndianCurrency(grandNetArrear);
            document.getElementById('footerNetArrear').innerText = formatIndianCurrency(grandNetArrear);
        }

        // Event listener for increment month change
        document.getElementById('incrementMonthSelect').addEventListener('change', function() {
            applyAnnualIncrements(0);
            renderTable();
        });

        // Event listener for header NPS percentage input
        document.getElementById('headerNpsInput').addEventListener('input', function() {
            calculateAll();
        });

        // Event listener for Add Row(s) button
        document.getElementById('addRowBtn').addEventListener('click', function() {
            const countInput = document.getElementById('rowCountInput');
            let count = parseInt(countInput.value) || 1;
            if (count < 1) count = 1;

            for (let k = 0; k < count; k++) {
                const lastItem = rawData[rawData.length - 1];
                let mIndex = monthsList.indexOf(lastItem ? lastItem.month : "January");
                if (mIndex === -1) mIndex = 0;
                let nextMIndex = (mIndex + 1) % 12;
                let nextYear = lastItem ? parseInt(lastItem.year) || 2022 : 2022;
                if (nextMIndex === 0) {
                    nextYear += 1;
                }
                const nextMonth = monthsList[nextMIndex];

                rawData.push({
                    month: nextMonth,
                    year: nextYear,
                    basic: lastItem ? lastItem.basic : 49300,
                    prevDA: lastItem ? lastItem.prevDA : 34,
                    revDA: lastItem ? lastItem.revDA : 38
                });
            }

            countInput.value = 1;
            applyAnnualIncrements(0);
            renderTable();
        });

        // Reset button listener
        document.getElementById('resetBtn').addEventListener('click', function() {
            rawData = JSON.parse(JSON.stringify(defaultRawData));
            document.getElementById('incrementMonthSelect').value = "October";
            document.getElementById('headerNpsInput').value = 0;
            document.getElementById('rowCountInput').value = 1;
            applyAnnualIncrements(0);
            renderTable();
        });

        // Live calculation during typing without losing input focus
        document.addEventListener('input', function(e) {
            if (e.target && e.target.dataset && e.target.dataset.field) {
                const index = parseInt(e.target.dataset.index);
                const field = e.target.dataset.field;
                rawData[index][field] = e.target.value;
                calculateAll();
            }
        });

        // Downward propagation and structural re-rendering on change (committed edit)
        document.addEventListener('change', function(e) {
            if (e.target && e.target.dataset && e.target.dataset.field) {
                const index = parseInt(e.target.dataset.index);
                const field = e.target.dataset.field;
                rawData[index][field] = e.target.value;

                if (field === 'month' || field === 'year') {
                    cascadeMonthsAndYears(index);
                    applyAnnualIncrements(0);
                } else if (field === 'basic') {
                    rawData[index].basic = parseFloat(e.target.value) || 0;
                    
                    let incrementMonth = document.getElementById('incrementMonthSelect').value;
                    let applyIncrements = incrementMonth !== "None";
                    
                    let runningBasic = rawData[index].basic;
                    let prevYear = parseInt(rawData[index].year) || 2022;
                    let prevMonthIdx = monthsList.indexOf(rawData[index].month);
                    if (prevMonthIdx === -1) prevMonthIdx = 0;

                    let monthYearMap = {};
                    for (let j = 0; j <= index; j++) {
                        let k = `${rawData[j].month}_${rawData[j].year}`;
                        if (!monthYearMap.hasOwnProperty(k)) {
                            monthYearMap[k] = rawData[j].basic;
                        }
                    }
                    monthYearMap[`${rawData[index].month}_${rawData[index].year}`] = runningBasic;

                    for (let k = index + 1; k < rawData.length; k++) {
                        let item = rawData[k];
                        let itemYear = parseInt(item.year) || 2022;
                        let itemMonthIdx = monthsList.indexOf(item.month);
                        if (itemMonthIdx === -1) itemMonthIdx = 0;

                        let myKey = `${item.month}_${item.year}`;

                        if (monthYearMap.hasOwnProperty(myKey)) {
                            item.basic = monthYearMap[myKey];
                            runningBasic = item.basic;
                        } else {
                            if (applyIncrements && item.month === incrementMonth) {
                                if (itemYear > prevYear || (itemYear === prevYear && itemMonthIdx > prevMonthIdx)) {
                                    let increment = Math.round((runningBasic * 0.03) / 100) * 100;
                                    runningBasic += increment;
                                }
                            }
                            item.basic = runningBasic;
                            monthYearMap[myKey] = runningBasic;
                        }
                        prevYear = itemYear;
                        prevMonthIdx = itemMonthIdx;
                    }
                } else {
                    cascadeFieldDown(index, field);
                }
                renderTable();
            }
        });

        // Initial setup call
        applyAnnualIncrements(0);
        renderTable();
    </script>
</body>
</html>
