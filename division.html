<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Long Division Worksheet Generator</title>

<style>

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg-workspace: #ffffff; /* White background */

  /* Digit cell width */
  --digit-width: 28px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Segoe UI", sans-serif;
  background: var(--bg-workspace); /* Plain White */
  color: #000;
  padding-bottom: 40px;
  overflow-x: hidden;
}

.controls-panel {
  background: #fff;
  padding: 16px;
  border-bottom: 1.5px solid #e2e8f0;
  box-shadow: none; /* Shadow removed */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.app-title {
  font-size: 1.4rem;
  font-weight: 800;
  text-align: center;
}

.controls-wrapper {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 600px;
}

.controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 150px;
  flex: 1 1 200px;
}

.group-label {
  font-size: .75rem;
  font-weight: 700;
  color: #334155;
  text-transform: uppercase;
}

.form-group select {
  padding: 8px 10px;
  border: 1.5px solid #cbd5e1;
  border-radius: 6px;
  font-size: .88rem;
  font-weight: 600;
  background: #f8fafc;
}

.checkbox-group {
  justify-content: flex-end;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  padding: 8px 10px;
  background: #f8fafc;
  border: 1.5px solid #cbd5e1;
  border-radius: 6px;
  min-height: 38px;
  user-select: none;
  white-space: nowrap;
}

.checkbox-label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}

.line-digits-group {
  display: flex;
  gap: 7px;
  align-items: flex-end;
  background: #f1f5f9;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1.5px solid #cbd5e1;
}

.line-digit-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  flex: 1;
}

.line-digit-item span {
  font-size: .65rem;
  font-weight: 700;
  color: #64748b;
}

.line-digit-item select {
  min-width: 75px;
  padding: 4px;
  font-size: .78rem;
  text-align: center;
  width: 100%;
}

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.btn {
  min-width: 125px;
  height: 38px;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: 700;
  font-size: .84rem;
  cursor: pointer;
}

.btn-generate { background: var(--primary); }
.btn-generate:hover { background: var(--primary-hover); }
.btn-reset { background: #64748b; }

#worksheetContainer {
  width: 100%;
  padding: 10px 5px;
}

/* Landscape A4 Dimensions */
.paper-sheet {
  width: 297mm;
  min-height: 210mm;
  max-width: 100%;
  margin: 15px auto;
  background: #fff;
  padding: 8mm 10mm;
  box-shadow: none; /* Shadow removed */
  border: 1px solid #e2e8f0;
}

.worksheet-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid #000;
  padding-bottom: 6mm;
  margin-bottom: 12px;
  gap: 10px;
}

.worksheet-title {
  font-size: 1.35rem;
  font-weight: 800;
}

/* 3 Column Grid for Landscape mode to fit more questions */
.problems-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 16px;
  row-gap: 24px;
  width: 100%;
  align-items: start;
}

.problem-card {
  display: flex;
  width: 100%;
  gap: 4px;
  background: transparent;
  border: none;
  padding: 2px 0;
  min-height: auto;
  overflow: visible;
}

.problem-num {
  width: 22px;
  flex-shrink: 0;
  font-family: Arial, sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  padding-top: 28px;
  color: #dc2626 !important; /* Made Red as requested */
}

.long-division-container {
  font-family: "Courier New", Courier, monospace;
  font-size: 1.3rem !important; /* Updated font size to 1.3rem */
  font-weight: 700;
  line-height: 1;
  color: #000;
  width: 100%;
  position: relative;
}

.division-header {
  position: relative;
  width: 100%;
  height: 30px;
  margin-left: calc(var(--digit-width) * 1.8);
}

.quotient-grid {
  position: absolute;
  top: 0;
  left: 0;
  height: 30px;
  display: flex;
  white-space: nowrap;
  z-index: 2;
}

.quotient-digit {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  color: #2563eb;
}

.division-line {
  display: flex;
  align-items: flex-start;
  height: 32px;
}

.divisor {
  width: calc(var(--digit-width) * 1.8);
  min-width: calc(var(--digit-width) * 1.8);
  color: #c2410c;
  text-align: right;
  padding-right: 4px;
  white-space: nowrap;
}

.dividend-area {
  position: relative;
  border-top: 2px solid #000;
  border-left: 2px solid #000;
  height: 32px;
  transition: width 0.05s ease-out;
}

.digit-grid {
  display: flex;
  height: 30px;
  white-space: nowrap;
  transition: width 0.05s ease-out;
}

.digit-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 30px;
  line-height: 30px;
}

.work-area {
  position: relative;
  margin-left: calc(var(--digit-width) * 1.8);
  width: calc(var(--digit-width) * 8);
  min-height: auto;
}

.work-row {
  position: relative;
  height: 28px;
  width: 100%;
}

.step-cells-container {
  position: absolute;
  top: 0;
  display: flex;
  height: 26px;
  line-height: 26px;
}

.step-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 26px;
}

.work-row.subtraction-row .step-cells-container {
  border-bottom: 1.5px solid #000;
  padding-bottom: 1px;
}

.work-row.subtraction-row .step-cells-container::before {
  content: "-";
  position: absolute;
  left: -14px;
  top: 0;
  font-weight: 700;
}

.solution-summary {
  margin-top: 6px;
  font-family: Arial, sans-serif;
  font-size: .85rem;
  font-weight: 700;
  color: #166534;
  line-height: 1.35;
}

.page-break {
  page-break-before: always;
  break-before: page;
}

/* Editable Input Styles */
.editable-full-dividend {
  width: 100%;
  height: 30px;
  line-height: 30px;
  border: none;
  background: transparent;
  outline: none;
  font-family: "Courier New", Courier, monospace;
  font-size: 1.3rem !important;
  font-weight: 700;
  color: inherit;
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  text-align: left;
}

.editable-divisor {
  font-family: "Courier New", Courier, monospace;
  font-size: inherit;
  font-weight: 700;
  color: #c2410c;
  border: none;
  background: transparent;
  outline: none;
  padding: 0;
  margin: 0;
  text-align: right;
  width: 100%;
  height: 30px;
  line-height: 30px;
}

@media print {
  @page {
    size: A4 landscape;
    margin: 0;
  }
  .no-print { display: none !important; }
  body { background: #fff !important; padding: 0 !important; }
  #worksheetContainer { padding: 0 !important; }
  .paper-sheet {
    width: 297mm !important;
    min-height: 210mm !important;
    margin: 0 !important;
    padding: 8mm 10mm !important;
    box-shadow: none !important;
    border: none !important;
  }
  .page-break { page-break-before: always !important; break-before: page !important; }
  .quotient-digit, .work-number.remainder, .divisor, .editable-divisor { color: #000 !important; }
  .problem-num { color: #dc2626 !important; } /* Ensure printed SR. No. stays red */
  .editable-full-dividend, .editable-divisor { border: none !important; background: transparent !important; }
}

@media (max-width: 900px) {
  .problems-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
  .problems-grid { grid-template-columns: 1fr; }
  .paper-sheet { padding: 6mm; min-height: auto; }
  .worksheet-header { flex-direction: column; align-items: flex-start; }
}

</style>
</head>

<body>

<div class="controls-panel no-print">
  <h1 class="app-title">Long Division Worksheet Generator</h1>
  <div class="controls-wrapper">
    <div class="controls-row">
      <div class="form-group">
        <label class="group-label">Digits Config:</label>
        <div id="lineDigitsContainer" class="line-digits-group"></div>
      </div>
      <div class="form-group">
        <label class="group-label" for="numQuestions">No. of Questions:</label>
        <select id="numQuestions" onchange="onSettingsChange()"></select>
      </div>
    </div>
    <div class="controls-row">
      <div class="form-group checkbox-group">
        <label class="group-label">&nbsp;</label>
        <label class="checkbox-label" for="showAnswersCheckbox">
          <input type="checkbox" id="showAnswersCheckbox" onchange="onAnswerOptionChange()">
          Show Answers
        </label>
      </div>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateNewQuestions()">Generate New</button>
    <button class="btn btn-reset" onclick="resetToDefaults()">Reset</button>
  </div>
</div>

<div id="worksheetContainer"></div>

<script>

let currentLineDigits = [3, 1];
let problems = [];

function initQuestionDropdown() {
  const select = document.getElementById("numQuestions");
  select.innerHTML = "";
  for (let i = 2; i <= 60; i += 2) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = `${i} Questions`;
    if (i === 12) option.selected = true;
    select.appendChild(option);
  }
}

function renderLineDigitInputs() {
  const container = document.getElementById("lineDigitsContainer");
  container.innerHTML = "";
  const labels = ["Dividend", "Divisor"];
  currentLineDigits.forEach((digits, index) => {
    const item = document.createElement("div");
    item.className = "line-digit-item";
    const minLimit = 1;
    const maxLimit = index === 0 ? 7 : 3;
    let options = "";
    for (let d = minLimit; d <= maxLimit; d++) {
      options += `<option value="${d}" ${d === digits ? "selected" : ""}>${d} Digit${d > 1 ? "s" : ""}</option>`;
    }
    item.innerHTML = `
      <span>${labels[index]}</span>
      <select onchange="updateLineDigitVal(${index}, this.value)">${options}</select>
    `;
    container.appendChild(item);
  });
}

function updateLineDigitVal(index, value) {
  currentLineDigits[index] = parseInt(value) || 1;
  renderLineDigitInputs();
  saveStateToLocalStorage();
}

function computeLongDivisionSteps(dividend, divisor) {
  const digits = String(dividend).split("").map(Number);
  let current = 0;
  let quotient = "";
  let steps = [];
  let started = false;

  for (let i = 0; i < digits.length; i++) {
    current = current * 10 + digits[i];

    if (!started && current < divisor) {
      continue;
    }

    const q = Math.floor(current / divisor);
    const product = q * divisor;
    const remainder = current - product;

    quotient += q;
    started = true;

    steps.push({
      startColumn: i - String(product).length + 1,
      endColumn: i,
      product: product,
      remainder: remainder,
      nextDigit: i + 1 < digits.length ? digits[i + 1] : null,
      nextColumn: i + 1
    });

    current = remainder;
  }

  quotient = quotient.replace(/^0+/, "") || "0";

  return {
    quotient: parseInt(quotient, 10),
    remainder: current,
    steps: steps
  };
}

function generateNewQuestions() {
  const questionsCount = parseInt(document.getElementById("numQuestions").value) || 12;
  problems = [];

  const dividendDigits = currentLineDigits[0];
  const divisorDigits = currentLineDigits[1];
  
  const minDivisor = divisorDigits === 1 ? 1 : Math.pow(10, divisorDigits - 1);
  const maxDivisor = Math.pow(10, divisorDigits) - 1;
  
  const minDividend = dividendDigits === 1 ? 1 : Math.pow(10, dividendDigits - 1);
  const maxDividend = Math.pow(10, dividendDigits) - 1;

  for (let i = 0; i < questionsCount; i++) {
    let divisor = Math.floor(Math.random() * (maxDivisor - minDivisor + 1)) + minDivisor;
    let minValidDividend = Math.max(minDividend, divisor + 1);
    
    if (minValidDividend > maxDividend) {
      minValidDividend = minDividend;
    }

    let dividend = Math.floor(Math.random() * (maxDividend - minValidDividend + 1)) + minValidDividend;

    const details = computeLongDivisionSteps(dividend, divisor);

    problems.push({
      id: i + 1,
      dividend: dividend,
      divisor: divisor,
      quotient: details.quotient,
      remainder: details.remainder,
      steps: details.steps
    });
  }

  saveStateToLocalStorage();
  renderWorksheetDOM();
}

function onAnswerOptionChange() {
  saveStateToLocalStorage();
  renderWorksheetDOM();
}

function onSettingsChange() {
  saveStateToLocalStorage();
}

function resetToDefaults() {
  currentLineDigits = [3, 1];
  document.getElementById("numQuestions").value = "12";
  document.getElementById("showAnswersCheckbox").checked = false;
  renderLineDigitInputs();
  generateNewQuestions();
}

function saveStateToLocalStorage() {
  const state = {
    currentLineDigits: currentLineDigits,
    numQuestions: document.getElementById("numQuestions").value,
    showAnswers: document.getElementById("showAnswersCheckbox").checked,
    problems: problems
  };
  localStorage.setItem("division_worksheet_state_v1", JSON.stringify(state));
}

function loadStateFromLocalStorage() {
  const saved = localStorage.getItem("division_worksheet_state_v1");
  if (saved) {
    try {
      const state = JSON.parse(saved);
      if (Array.isArray(state.currentLineDigits)) currentLineDigits = state.currentLineDigits;
      if (state.numQuestions) document.getElementById("numQuestions").value = state.numQuestions;
      if (typeof state.showAnswers !== "undefined") {
        document.getElementById("showAnswersCheckbox").checked = state.showAnswers;
      }
      if (Array.isArray(state.problems) && state.problems.length > 0) {
        problems = state.problems;
        return true;
      }
    } catch (e) {
      console.error("Local storage load error:", e);
    }
  }
  return false;
}

function renderWorksheetDOM() {
  let maxDigits = currentLineDigits[0] || 3;
  
  problems.forEach(p => {
    if (p && p.dividend) {
      maxDigits = Math.max(maxDigits, String(p.dividend).length);
    }
  });
  
  let computedCellWidth = 28;
  if (maxDigits >= 7) {
    computedCellWidth = 23;
  } else if (maxDigits >= 5) {
    computedCellWidth = 26;
  }
  document.documentElement.style.setProperty('--digit-width', `${computedCellWidth}px`);

  const showAnswers = document.getElementById("showAnswersCheckbox").checked;
  const container = document.getElementById("worksheetContainer");
  container.innerHTML = "";

  const problemsPerPage = 9;
  const totalPages = Math.ceil(problems.length / problemsPerPage);

  for (let page = 0; page < totalPages; page++) {
    const pageProblems = problems.slice(page * problemsPerPage, (page + 1) * problemsPerPage);
    const sheet = document.createElement("div");
    sheet.className = "paper-sheet";
    if (page > 0) sheet.classList.add("page-break");

    sheet.innerHTML = `
      <div class="worksheet-header">
        <div class="worksheet-title">
          Long Division Worksheet
          ${totalPages > 1 ? `<span style="font-size:.82rem; font-weight:600;"> Page ${page + 1}/${totalPages}</span>` : ""}
        </div>
      </div>
      <div class="problems-grid">
        ${pageProblems.map((p, idx) => renderCard(p, showAnswers, idx === 0 && page === 0, computedCellWidth)).join("")}
      </div>
    `;
    container.appendChild(sheet);
  }
}

function renderCard(p, showAnswers, isFirst, cellWidth) {
  return `
    <div class="problem-card">
      <div class="problem-num">${p.id}.</div>
      <div style="flex-grow: 1;">${renderCardContent(p, showAnswers, isFirst, cellWidth)}</div>
    </div>
  `;
}

function renderCardContent(p, showAnswers, isFirst, cellWidth) {
  const dividendString = String(p.dividend);
  let quotientDigits = "";

  if (showAnswers) {
    const qString = String(p.quotient);
    quotientDigits = `<div class="quotient-grid">`;
    
    const totalCols = dividendString.length;
    const qLen = qString.length;

    for (let i = 0; i < totalCols; i++) {
      if (i >= totalCols - qLen) {
        const charIdx = i - (totalCols - qLen);
        quotientDigits += `<div class="quotient-digit">${qString[charIdx]}</div>`;
      } else {
        quotientDigits += `<div class="quotient-digit"></div>`;
      }
    }
    quotientDigits += `</div>`;
  }

  let divisorHTML = '';
  if (isFirst) {
    divisorHTML = `<input type="text" class="editable-divisor" value="${p.divisor}" onclick="this.select()" onchange="updateFirstDivisor(this.value)">`;
  } else {
    divisorHTML = p.divisor;
  }

  let dividendHTML = "";
  const dividendWidth = dividendString.length * cellWidth;

  if (isFirst) {
    const charWidthEstimate = 12.5;
    const letterSpacing = cellWidth - charWidthEstimate;
    const initialIndent = letterSpacing / 2;

    dividendHTML = `
      <input type="text" id="first-dividend-input" class="editable-full-dividend" value="${dividendString}" 
             style="letter-spacing: ${letterSpacing.toFixed(2)}px; text-indent: ${initialIndent.toFixed(2)}px; padding: 0;" 
             onclick="this.select()" 
             onfocus="this.select()" 
             oninput="handleDividendInput(this)"
             onchange="updateFirstDividend(this.value)">`;
  } else {
    for (let i = 0; i < dividendString.length; i++) {
      dividendHTML += `<div class="digit-cell">${dividendString[i]}</div>`;
    }
  }

  let html = `
    <div class="long-division-container">
      <div class="division-header">${quotientDigits}</div>
      <div class="division-line">
        <div class="divisor">${divisorHTML}</div>
        <div id="first-dividend-area" class="dividend-area" style="width: ${dividendWidth}px;">
          <div id="first-digit-grid" class="digit-grid" style="width: ${dividendWidth}px;">${dividendHTML}</div>
        </div>
      </div>
  `;

  if (showAnswers) {
    html += `<div class="work-area">`;

    p.steps.forEach((step) => {
      const productString = String(step.product);
      const productStart = step.startColumn;

      let productCellsHTML = "";
      for (let c = 0; c < productString.length; c++) {
        productCellsHTML += `<div class="step-cell">${productString[c]}</div>`;
      }

      html += `
        <div class="work-row subtraction-row">
          <div class="step-cells-container" style="left: ${productStart * cellWidth}px;">
            ${productCellsHTML}
          </div>
        </div>
      `;

      if (step.nextDigit !== null) {
        const nextValue = step.remainder * 10 + step.nextDigit;
        const nextString = String(nextValue);
        const nextStart = step.nextColumn - nextString.length + 1;

        let nextCellsHTML = "";
        for (let c = 0; c < nextString.length; c++) {
          nextCellsHTML += `<div class="step-cell">${nextString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${nextStart * cellWidth}px;">
              ${nextCellsHTML}
            </div>
          </div>
        `;
      } else {
        const remainderString = String(step.remainder);
        const remainderStart = dividendString.length - remainderString.length;

        let remCellsHTML = "";
        for (let c = 0; c < remainderString.length; c++) {
          remCellsHTML += `<div class="step-cell" style="color: #2563eb;">${remainderString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${remainderStart * cellWidth}px;">
              ${remCellsHTML}
            </div>
          </div>
        `;
      }
    });

    html += `
      </div>
      <div class="solution-summary">
        <div>Quotient = ${p.quotient}</div>
        <div>Remainder = ${p.remainder}</div>
      </div>
    `;
  } else {
    const emptyBoxHeight = Math.max(90, (p.steps.length * 40));
    html += `<div style="height: ${emptyBoxHeight}px;"></div>`;
  }

  html += `</div>`;
  return html;
}

function handleDividendInput(input) {
  const val = input.value;
  const currentLength = Math.max(1, val.length);
  const cellWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--digit-width')) || 28;
  const newWidth = currentLength * cellWidth;

  const area = document.getElementById("first-dividend-area");
  const grid = document.getElementById("first-digit-grid");
  if (area) area.style.width = newWidth + "px";
  if (grid) grid.style.width = newWidth + "px";

  const charWidthEstimate = 12.5;
  const letterSpacing = cellWidth - charWidthEstimate;
  const initialIndent = letterSpacing / 2;

  input.style.letterSpacing = `${letterSpacing.toFixed(2)}px`;
  input.style.textIndent = `${initialIndent.toFixed(2)}px`;
}

function updateFirstDivisor(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  problems[0].divisor = num;
  recomputeFirstProblem();
}

function updateFirstDividend(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  
  problems[0].dividend = num;
  recomputeFirstProblem();
}

function recomputeFirstProblem() {
  const details = computeLongDivisionSteps(problems[0].dividend, problems[0].divisor);
  problems[0].quotient = details.quotient;
  problems[0].remainder = details.remainder;
  problems[0].steps = details.steps;

  saveStateToLocalStorage();
  renderWorksheetDOM();
}

window.onload = function() {
  initQuestionDropdown();
