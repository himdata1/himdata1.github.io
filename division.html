<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Long Division Worksheet Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg-workspace: #cbd5e1;

  /* Width of ONE dividend digit cell */
  --digit-width: 28px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Segoe UI", sans-serif;
  background: var(--bg-workspace);
  color: #000;
  padding-bottom: 40px;
  overflow-x: hidden;
}

.controls-panel {
  background: #fff;
  padding: 16px;
  border-bottom: 2px solid #94a3b8;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.app-title {
  font-size: 1.4rem;
  font-weight: 800;
  text-align: center;
}

.controls-wrapper {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  max-width: 1000px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 150px;
}

.group-label {
  font-size: .75rem;
  font-weight: 700;
  color: #334155;
  text-transform: uppercase;
}

.form-group select {
  padding: 8px 10px;
  border: 1.5px solid #cbd5e1;
  border-radius: 6px;
  font-size: .88rem;
  font-weight: 600;
  background: #f8fafc;
}

.line-digits-group {
  display: flex;
  gap: 7px;
  align-items: flex-end;
  background: #f1f5f9;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1.5px solid #cbd5e1;
}

.line-digit-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.line-digit-item span {
  font-size: .65rem;
  font-weight: 700;
  color: #64748b;
}

.line-digit-item select {
  min-width: 75px;
  padding: 4px;
  font-size: .78rem;
  text-align: center;
}

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.btn {
  min-width: 125px;
  height: 38px;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: 700;
  font-size: .84rem;
  cursor: pointer;
}

.btn-generate { background: var(--primary); }
.btn-generate:hover { background: var(--primary-hover); }
.btn-reset { background: #64748b; }
.btn-pdf { background: #0284c7; }
.btn-print { background: #059669; }

#worksheetContainer {
  width: 100%;
  padding: 10px 15px;
}

.paper-sheet {
  width: 210mm;
  min-height: 297mm;
  max-width: 100%;
  margin: 15px auto;
  background: #fff;
  padding: 12mm 14mm;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

.worksheet-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid #000;
  padding-bottom: 8px;
  margin-bottom: 22px;
  gap: 10px;
}

.worksheet-title {
  font-size: 1.35rem;
  font-weight: 800;
}

.student-info {
  display: flex;
  gap: 16px;
  font-size: .82rem;
  font-weight: 700;
  white-space: nowrap;
}

.problems-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 35px;
  row-gap: 25px;
  width: 100%;
  align-items: start;
}

.problem-card {
  display: flex;
  width: 100%;
  gap: 5px;
  background: transparent;
  border: none;
  padding: 4px 2px;
  min-height: 225px;
}

.problem-num {
  width: 25px;
  flex-shrink: 0;
  font-family: Arial, sans-serif;
  font-size: .95rem;
  font-weight: 700;
  padding-top: 4px;
}

.long-division-container {
  font-family: "Courier New", Courier, monospace;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1;
  color: #000;
  width: 220px;
  position: relative;
}

.division-header {
  position: relative;
  width: max-content;
  height: 26px;
}

.quotient-grid {
  position: absolute;
  top: 0;
  height: 24px;
  display: flex;
  white-space: nowrap;
  z-index: 2;
}

.quotient-digit {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  color: #2563eb;
}

.division-line {
  display: flex;
  align-items: flex-start;
  height: 28px;
}

.divisor {
  width: 45px;
  min-width: 45px;
  color: #c2410c;
  text-align: right;
  padding-right: 6px;
  white-space: nowrap;
}

.dividend-area {
  position: relative;
  border-top: 2px solid #000;
  border-left: 2px solid #000;
  height: 28px;
}

.digit-grid {
  display: flex;
  height: 26px;
  white-space: nowrap;
}

.digit-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 26px;
}

.work-area {
  position: relative;
  margin-left: 45px;
  width: calc(var(--digit-width) * 6);
  min-height: 170px;
}

.work-row {
  position: relative;
  height: 26px;
  width: 100%;
}

.step-cells-container {
  position: absolute;
  top: 0;
  display: flex;
  height: 24px;
  line-height: 24px;
}

.step-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 24px;
}

.work-row.subtraction-row .step-cells-container {
  border-bottom: 1.5px solid #000;
  padding-bottom: 1px;
}

.work-row.subtraction-row .step-cells-container::before {
  content: "-";
  position: absolute;
  left: -14px;
  top: 0;
  font-weight: 700;
}

.solution-summary {
  margin-top: 8px;
  font-family: Arial, sans-serif;
  font-size: .82rem;
  font-weight: 700;
  color: #166534;
  line-height: 1.45;
}

.page-break {
  page-break-before: always;
  break-before: page;
}

.editable-input {
  font-family: "Courier New", Courier, monospace;
  font-size: 1.1rem;
  font-weight: 700;
  color: inherit;
  border: none;
  background: transparent;
  outline: none;
  padding: 0 0 0 4px;
  margin: 0;
  height: 26px;
  line-height: 26px;
  letter-spacing: 21.5px;
}

.editable-divisor {
  font-family: "Courier New", Courier, monospace;
  font-size: 1.1rem;
  font-weight: 700;
  color: #c2410c;
  border: none;
  background: transparent;
  outline: none;
  padding: 0;
  margin: 0;
  text-align: right;
  width: 42px;
  height: 26px;
  line-height: 26px;
}

body.pdf-mode { background: #fff; }
body.pdf-mode .paper-sheet {
  width: 210mm !important;
  min-height: 297mm !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 12mm 14mm !important;
  box-shadow: none !important;
}

@media print {
  .no-print { display: none !important; }
  body { background: #fff !important; padding: 0 !important; }
  #worksheetContainer { padding: 0 !important; }
  .paper-sheet {
    width: 210mm !important;
    min-height: 297mm !important;
    margin: 0 !important;
    padding: 12mm 14mm !important;
    box-shadow: none !important;
  }
  .page-break { page-break-before: always !important; break-before: page !important; }
  .quotient-digit, .work-number.remainder, .divisor, .editable-divisor { color: #000 !important; }
  .editable-input, .editable-divisor { border: none !important; background: transparent !important; }
}

@media (max-width: 768px) {
  .problems-grid { grid-template-columns: 1fr; }
  .paper-sheet { padding: 10mm; min-height: auto; }
  .worksheet-header { flex-direction: column; align-items: flex-start; }
  .student-info { flex-wrap: wrap; }
}

</style>
</head>

<body>

<div class="controls-panel no-print">
  <h1 class="app-title">Long Division Worksheet Generator</h1>
  <div class="controls-wrapper">
    <div class="form-group">
      <label class="group-label">Digits Config:</label>
      <div id="lineDigitsContainer" class="line-digits-group"></div>
    </div>
    <div class="form-group">
      <label class="group-label" for="numQuestions">No. of Questions:</label>
      <select id="numQuestions" onchange="saveAndGenerate()"></select>
    </div>
    <div class="form-group">
      <label class="group-label" for="answerOption">Answer Options:</label>
      <select id="answerOption" onchange="saveAndGenerate()">
        <option value="no_answers" selected>No Answers</option>
        <option value="show_answers">Show Full Solution Steps</option>
      </select>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateWorksheet()">Generate New</button>
    <button class="btn btn-reset" onclick="resetToDefaults()">Reset</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn btn-print" onclick="window.print()">Print Sheet</button>
  </div>
</div>

<div id="worksheetContainer"></div>

<script>

let currentLineDigits = [3, 2];
let problems = [];

function initQuestionDropdown() {
  const select = document.getElementById("numQuestions");
  select.innerHTML = "";
  for (let i = 2; i <= 16; i += 2) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = `${i} Questions`;
    if (i === 12) option.selected = true;
    select.appendChild(option);
  }
}

function renderLineDigitInputs() {
  const container = document.getElementById("lineDigitsContainer");
  container.innerHTML = "";
  const labels = ["Dividend", "Divisor"];
  currentLineDigits.forEach((digits, index) => {
    const item = document.createElement("div");
    item.className = "line-digit-item";
    const minLimit = index === 0 ? 2 : 1;
    const maxLimit = index === 0 ? 4 : 3;
    let options = "";
    for (let d = minLimit; d <= maxLimit; d++) {
      options += `<option value="${d}" ${d === digits ? "selected" : ""}>${d} Digit${d > 1 ? "s" : ""}</option>`;
    }
    item.innerHTML = `
      <span>${labels[index]}</span>
      <select onchange="updateLineDigitVal(${index}, this.value)">${options}</select>
    `;
    container.appendChild(item);
  });
}

function updateLineDigitVal(index, value) {
  currentLineDigits[index] = parseInt(value) || 1;
  renderLineDigitInputs();
  saveAndGenerate();
}

function resetToDefaults() {
  currentLineDigits = [3, 2];
  document.getElementById("numQuestions").value = "12";
  document.getElementById("answerOption").value = "no_answers";
  renderLineDigitInputs();
  saveAndGenerate();
}

function saveAndGenerate() {
  const settings = {
    lineDigits: currentLineDigits,
    numQuestions: document.getElementById("numQuestions").value,
    answerOption: document.getElementById("answerOption").value
  };
  localStorage.setItem("division_worksheet_settings_v18", JSON.stringify(settings));
  generateWorksheet();
}

function loadSavedChoices() {
  const saved = localStorage.getItem("division_worksheet_settings_v18");
  if (saved) {
    try {
      const settings = JSON.parse(saved);
      if (Array.isArray(settings.lineDigits)) currentLineDigits = settings.lineDigits;
      if (settings.numQuestions) document.getElementById("numQuestions").value = settings.numQuestions;
      if (settings.answerOption) document.getElementById("answerOption").value = settings.answerOption;
    } catch (e) {
      console.log("Settings load error", e);
    }
  }
  renderLineDigitInputs();
}

function computeLongDivisionSteps(dividend, divisor) {
  const digits = String(dividend).split("").map(Number);
  let current = 0;
  let quotient = "";
  let steps = [];
  let started = false;

  for (let i = 0; i < digits.length; i++) {
    current = current * 10 + digits[i];

    if (!started && current < divisor) {
      continue;
    }

    const q = Math.floor(current / divisor);
    const product = q * divisor;
    const remainder = current - product;

    quotient += q;
    started = true;

    steps.push({
      startColumn: i - String(product).length + 1,
      endColumn: i,
      product: product,
      remainder: remainder,
      nextDigit: i + 1 < digits.length ? digits[i + 1] : null,
      nextColumn: i + 1
    });

    current = remainder;
  }

  quotient = quotient.replace(/^0+/, "") || "0";

  return {
    quotient: parseInt(quotient, 10),
    remainder: current,
    steps: steps
  };
}

function generateWorksheet() {
  const questionsCount = parseInt(document.getElementById("numQuestions").value) || 12;
  const answerOption = document.getElementById("answerOption").value;
  problems = [];

  const dividendDigits = currentLineDigits[0];
  const divisorDigits = currentLineDigits[1];
  const minDivisor = Math.pow(10, divisorDigits - 1);
  const maxDivisor = Math.pow(10, divisorDigits) - 1;
  const maxDividend = Math.pow(10, dividendDigits) - 1;
  const minDividend = Math.pow(10, dividendDigits - 1);

  for (let i = 0; i < questionsCount; i++) {
    let divisor = Math.floor(Math.random() * (maxDivisor - minDivisor + 1)) + minDivisor;
    let minValidDividend = Math.max(minDividend, divisor + 1);
    let dividend = Math.floor(Math.random() * (maxDividend - minValidDividend + 1)) + minValidDividend;

    const details = computeLongDivisionSteps(dividend, divisor);

    problems.push({
      id: i + 1,
      dividend: dividend,
      divisor: divisor,
      quotient: details.quotient,
      remainder: details.remainder,
      steps: details.steps
    });
  }

  renderWorksheetDOM(answerOption);
}

function renderWorksheetDOM(answerOption) {
  const container = document.getElementById("worksheetContainer");
  container.innerHTML = "";
  const problemsPerPage = 6;
  const totalPages = Math.ceil(problems.length / problemsPerPage);

  for (let page = 0; page < totalPages; page++) {
    const pageProblems = problems.slice(page * problemsPerPage, (page + 1) * problemsPerPage);
    const sheet = document.createElement("div");
    sheet.className = "paper-sheet";
    if (page > 0) sheet.classList.add("page-break");

    sheet.innerHTML = `
      <div class="worksheet-header">
        <div class="worksheet-title">
          Long Division Worksheet
          ${totalPages > 1 ? `<span style="font-size:.82rem; font-weight:600;"> Page ${page + 1}/${totalPages}</span>` : ""}
        </div>
        <div class="student-info">
          <div>Name: ______________</div>
          <div>Date: ______________</div>
          <div>Score: ______</div>
        </div>
      </div>
      <div class="problems-grid">
        ${pageProblems.map((p, idx) => renderCard(p, answerOption === "show_answers", idx === 0 && page === 0)).join("")}
      </div>
    `;
    container.appendChild(sheet);
  }
}

function renderCard(p, showAnswers, isFirst) {
  return `
    <div class="problem-card">
      <div class="problem-num">${p.id}.</div>
      <div>${renderCardContent(p, showAnswers, isFirst)}</div>
    </div>
  `;
}

function renderCardContent(p, showAnswers, isFirst) {
  const dividendString = String(p.dividend);
  let quotientDigits = "";

  if (showAnswers) {
    const qString = String(p.quotient);
    const qStartCol = dividendString.length - qString.length;
    quotientDigits = `<div class="quotient-grid" style="left: ${qStartCol * 28}px;">`;
    for (let i = 0; i < qString.length; i++) {
      quotientDigits += `<div class="quotient-digit">${qString[i]}</div>`;
    }
    quotientDigits += `</div>`;
  }

  let divisorHTML = '';
  if (isFirst) {
    divisorHTML = `<input type="text" class="editable-divisor" value="${p.divisor}" onclick="this.select()" onchange="updateFirstDivisor(this.value)">`;
  } else {
    divisorHTML = p.divisor;
  }

  let dividendHTML = "";
  const dividendWidth = dividendString.length * 28;
  if (isFirst) {
    dividendHTML = `<input type="text" class="editable-input" style="width: ${dividendWidth}px;" value="${p.dividend}" onclick="this.select()" onchange="updateFirstDividend(this.value)">`;
  } else {
    for (let i = 0; i < dividendString.length; i++) {
      dividendHTML += `<div class="digit-cell">${dividendString[i]}</div>`;
    }
  }

  let html = `
    <div class="long-division-container">
      <div class="division-header">${quotientDigits}</div>
      <div class="division-line">
        <div class="divisor">${divisorHTML}</div>
        <div class="dividend-area" style="width: ${dividendWidth}px;">
          <div class="digit-grid" ${isFirst ? `style="width: ${dividendWidth}px;"` : ''}>${dividendHTML}</div>
        </div>
      </div>
  `;

  if (showAnswers) {
    html += `<div class="work-area">`;

    p.steps.forEach((step) => {
      const productString = String(step.product);
      const productStart = step.startColumn;

      let productCellsHTML = "";
      for (let c = 0; c < productString.length; c++) {
        productCellsHTML += `<div class="step-cell">${productString[c]}</div>`;
      }

      html += `
        <div class="work-row subtraction-row">
          <div class="step-cells-container" style="left: ${productStart * 28}px;">
            ${productCellsHTML}
          </div>
        </div>
      `;

      if (step.nextDigit !== null) {
        const nextValue = step.remainder * 10 + step.nextDigit;
        const nextString = String(nextValue);
        const nextStart = step.nextColumn - nextString.length + 1;

        let nextCellsHTML = "";
        for (let c = 0; c < nextString.length; c++) {
          nextCellsHTML += `<div class="step-cell">${nextString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${nextStart * 28}px;">
              ${nextCellsHTML}
            </div>
          </div>
        `;
      } else {
        const remainderString = String(step.remainder);
        const remainderStart = dividendString.length - remainderString.length;

        let remCellsHTML = "";
        for (let c = 0; c < remainderString.length; c++) {
          remCellsHTML += `<div class="step-cell" style="color: #2563eb;">${remainderString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${remainderStart * 28}px;">
              ${remCellsHTML}
            </div>
          </div>
        `;
      }
    });

    html += `
      </div>
      <div class="solution-summary">
        <div>Quotient = ${p.quotient}</div>
        <div>Remainder = ${p.remainder}</div>
      </div>
    `;
  } else {
    html += `<div style="height: 175px;"></div>`;
  }

  html += `</div>`;
  return html;
}

function updateFirstDivisor(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  problems[0].divisor = num;
  recomputeFirstProblem();
}

function updateFirstDividend(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  problems[0].dividend = num;
  recomputeFirstProblem();
}

function recomputeFirstProblem() {
  const details = computeLongDivisionSteps(problems[0].dividend, problems[0].divisor);
  problems[0].quotient = details.quotient;
  problems[0].remainder = details.remainder;
  problems[0].steps = details.steps;

  const answerOption = document.getElementById("answerOption").value;
  renderWorksheetDOM(answerOption);
}

async function downloadPDF() {
  const element = document.getElementById("worksheetContainer");
  document.body.classList.add("pdf-mode");

  const options = {
    margin: 0,
    filename: "Long_Division_Worksheet.pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: "#ffffff" },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: ["css", "legacy"], before: ".page-break" }
  };

  try {
    await html2pdf().set(options).from(element).save();
  } catch (error) {
    console.error("PDF-generation error:", error);
    alert("PDF generation failed.");
  } finally {
    document.body.classList.remove("pdf-mode");
  }
}

window.onload = function() {
  initQuestionDropdown();
  loadSavedChoices();
  generateWorksheet();
};

</script>

</body>
</html>
