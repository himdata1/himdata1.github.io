<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Long Division Worksheet Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg-workspace: #cbd5e1;

  /* Dynamically scaled digit cell width */
  --digit-width: 24px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, "Segoe UI", sans-serif;
  background: var(--bg-workspace);
  color: #000;
  padding-bottom: 40px;
  overflow-x: hidden;
}

.controls-panel {
  background: #fff;
  padding: 16px;
  border-bottom: 2px solid #94a3b8;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.app-title {
  font-size: 1.4rem;
  font-weight: 800;
  text-align: center;
}

.controls-wrapper {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  max-width: 1000px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 150px;
}

.group-label {
  font-size: .75rem;
  font-weight: 700;
  color: #334155;
  text-transform: uppercase;
}

.form-group select {
  padding: 8px 10px;
  border: 1.5px solid #cbd5e1;
  border-radius: 6px;
  font-size: .88rem;
  font-weight: 600;
  background: #f8fafc;
}

.line-digits-group {
  display: flex;
  gap: 7px;
  align-items: flex-end;
  background: #f1f5f9;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1.5px solid #cbd5e1;
}

.line-digit-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.line-digit-item span {
  font-size: .65rem;
  font-weight: 700;
  color: #64748b;
}

.line-digit-item select {
  min-width: 75px;
  padding: 4px;
  font-size: .78rem;
  text-align: center;
}

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.btn {
  min-width: 125px;
  height: 38px;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: 700;
  font-size: .84rem;
  cursor: pointer;
}

.btn-generate { background: var(--primary); }
.btn-generate:hover { background: var(--primary-hover); }
.btn-reset { background: #64748b; }
.btn-pdf { background: #0284c7; }
.btn-print { background: #059669; }

#worksheetContainer {
  width: 100%;
  padding: 10px 5px;
}

/* Margins reduced from 14mm to 8mm for extra display area */
.paper-sheet {
  width: 210mm;
  min-height: 297mm;
  max-width: 100%;
  margin: 15px auto;
  background: #fff;
  padding: 10mm 8mm;
  box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

.worksheet-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 2px solid #000;
  padding-bottom: 8px;
  margin-bottom: 18px;
  gap: 10px;
}

.worksheet-title {
  font-size: 1.35rem;
  font-weight: 800;
}

.student-info {
  display: flex;
  gap: 16px;
  font-size: .82rem;
  font-weight: 700;
  white-space: nowrap;
}

/* Reduced column-gap to allow wider division containers */
.problems-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 15px;
  row-gap: 20px;
  width: 100%;
  align-items: start;
}

.problem-card {
  display: flex;
  width: 100%;
  gap: 4px;
  background: transparent;
  border: none;
  padding: 2px 0;
  min-height: 225px;
  overflow: hidden;
}

.problem-num {
  width: 20px;
  flex-shrink: 0;
  font-family: Arial, sans-serif;
  font-size: .9rem;
  font-weight: 700;
  padding-top: 4px;
}

/* Dynamic width & font sizing to fit high digit count */
.long-division-container {
  font-family: "Courier New", Courier, monospace;
  font-size: calc(var(--digit-width) * 0.72);
  font-weight: 700;
  line-height: 1;
  color: #000;
  width: 100%;
  position: relative;
}

.division-header {
  position: relative;
  width: max-content;
  height: 24px;
}

.quotient-grid {
  position: absolute;
  top: 0;
  height: 24px;
  display: flex;
  white-space: nowrap;
  z-index: 2;
}

.quotient-digit {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  color: #2563eb;
}

.division-line {
  display: flex;
  align-items: flex-start;
  height: 26px;
}

.divisor {
  width: calc(var(--digit-width) * 1.6);
  min-width: calc(var(--digit-width) * 1.6);
  color: #c2410c;
  text-align: right;
  padding-right: 4px;
  white-space: nowrap;
}

.dividend-area {
  position: relative;
  border-top: 2px solid #000;
  border-left: 2px solid #000;
  height: 26px;
}

.digit-grid {
  display: flex;
  height: 24px;
  white-space: nowrap;
}

.digit-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 24px;
}

.work-area {
  position: relative;
  margin-left: calc(var(--digit-width) * 1.6);
  width: calc(var(--digit-width) * 8);
  min-height: 170px;
}

.work-row {
  position: relative;
  height: 24px;
  width: 100%;
}

.step-cells-container {
  position: absolute;
  top: 0;
  display: flex;
  height: 22px;
  line-height: 22px;
}

.step-cell {
  width: var(--digit-width);
  min-width: var(--digit-width);
  text-align: center;
  height: 22px;
}

.work-row.subtraction-row .step-cells-container {
  border-bottom: 1.5px solid #000;
  padding-bottom: 1px;
}

.work-row.subtraction-row .step-cells-container::before {
  content: "-";
  position: absolute;
  left: -12px;
  top: 0;
  font-weight: 700;
}

.solution-summary {
  margin-top: 8px;
  font-family: Arial, sans-serif;
  font-size: .8rem;
  font-weight: 700;
  color: #166534;
  line-height: 1.4;
}

.page-break {
  page-break-before: always;
  break-before: page;
}

.editable-input {
  font-family: "Courier New", Courier, monospace;
  font-size: inherit;
  font-weight: 700;
  color: inherit;
  border: none;
  background: transparent;
  outline: none;
  padding: 0 0 0 2px;
  margin: 0;
  height: 24px;
  line-height: 24px;
  letter-spacing: calc(var(--digit-width) - 13px);
}

.editable-divisor {
  font-family: "Courier New", Courier, monospace;
  font-size: inherit;
  font-weight: 700;
  color: #c2410c;
  border: none;
  background: transparent;
  outline: none;
  padding: 0;
  margin: 0;
  text-align: right;
  width: 100%;
  height: 24px;
  line-height: 24px;
}

body.pdf-mode { background: #fff; }
body.pdf-mode .paper-sheet {
  width: 210mm !important;
  min-height: 297mm !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 10mm 8mm !important;
  box-shadow: none !important;
}

@media print {
  .no-print { display: none !important; }
  body { background: #fff !important; padding: 0 !important; }
  #worksheetContainer { padding: 0 !important; }
  .paper-sheet {
    width: 210mm !important;
    min-height: 297mm !important;
    margin: 0 !important;
    padding: 10mm 8mm !important;
    box-shadow: none !important;
  }
  .page-break { page-break-before: always !important; break-before: page !important; }
  .quotient-digit, .work-number.remainder, .divisor, .editable-divisor { color: #000 !important; }
  .editable-input, .editable-divisor { border: none !important; background: transparent !important; }
}

@media (max-width: 768px) {
  .problems-grid { grid-template-columns: 1fr; }
  .paper-sheet { padding: 8mm; min-height: auto; }
  .worksheet-header { flex-direction: column; align-items: flex-start; }
  .student-info { flex-wrap: wrap; }
}

</style>
</head>

<body>

<div class="controls-panel no-print">
  <h1 class="app-title">Long Division Worksheet Generator</h1>
  <div class="controls-wrapper">
    <div class="form-group">
      <label class="group-label">Digits Config:</label>
      <div id="lineDigitsContainer" class="line-digits-group"></div>
    </div>
    <div class="form-group">
      <label class="group-label" for="numQuestions">No. of Questions:</label>
      <select id="numQuestions" onchange="onSettingsChange()"></select>
    </div>
    <div class="form-group">
      <label class="group-label" for="answerOption">Answer Options:</label>
      <select id="answerOption" onchange="onAnswerOptionChange()">
        <option value="no_answers" selected>No Answers</option>
        <option value="show_answers">Show Answers</option>
      </select>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn btn-generate" onclick="generateNewQuestions()">Generate New</button>
    <button class="btn btn-reset" onclick="resetToDefaults()">Reset</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn btn-print" onclick="window.print()">Print Sheet</button>
  </div>
</div>

<div id="worksheetContainer"></div>

<script>

let currentLineDigits = [3, 2];
let problems = [];

function initQuestionDropdown() {
  const select = document.getElementById("numQuestions");
  select.innerHTML = "";
  for (let i = 2; i <= 16; i += 2) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = `${i} Questions`;
    if (i === 12) option.selected = true;
    select.appendChild(option);
  }
}

function renderLineDigitInputs() {
  const container = document.getElementById("lineDigitsContainer");
  container.innerHTML = "";
  const labels = ["Dividend", "Divisor"];
  currentLineDigits.forEach((digits, index) => {
    const item = document.createElement("div");
    item.className = "line-digit-item";
    const minLimit = 1;
    const maxLimit = index === 0 ? 7 : 3;
    let options = "";
    for (let d = minLimit; d <= maxLimit; d++) {
      options += `<option value="${d}" ${d === digits ? "selected" : ""}>${d} Digit${d > 1 ? "s" : ""}</option>`;
    }
    item.innerHTML = `
      <span>${labels[index]}</span>
      <select onchange="updateLineDigitVal(${index}, this.value)">${options}</select>
    `;
    container.appendChild(item);
  });
}

function updateLineDigitVal(index, value) {
  currentLineDigits[index] = parseInt(value) || 1;
  renderLineDigitInputs();
  saveStateToLocalStorage();
}

function computeLongDivisionSteps(dividend, divisor) {
  const digits = String(dividend).split("").map(Number);
  let current = 0;
  let quotient = "";
  let steps = [];
  let started = false;

  for (let i = 0; i < digits.length; i++) {
    current = current * 10 + digits[i];

    if (!started && current < divisor) {
      continue;
    }

    const q = Math.floor(current / divisor);
    const product = q * divisor;
    const remainder = current - product;

    quotient += q;
    started = true;

    steps.push({
      startColumn: i - String(product).length + 1,
      endColumn: i,
      product: product,
      remainder: remainder,
      nextDigit: i + 1 < digits.length ? digits[i + 1] : null,
      nextColumn: i + 1
    });

    current = remainder;
  }

  quotient = quotient.replace(/^0+/, "") || "0";

  return {
    quotient: parseInt(quotient, 10),
    remainder: current,
    steps: steps
  };
}

function generateNewQuestions() {
  const questionsCount = parseInt(document.getElementById("numQuestions").value) || 12;
  problems = [];

  const dividendDigits = currentLineDigits[0];
  const divisorDigits = currentLineDigits[1];
  
  const minDivisor = divisorDigits === 1 ? 1 : Math.pow(10, divisorDigits - 1);
  const maxDivisor = Math.pow(10, divisorDigits) - 1;
  
  const minDividend = dividendDigits === 1 ? 1 : Math.pow(10, dividendDigits - 1);
  const maxDividend = Math.pow(10, dividendDigits) - 1;

  for (let i = 0; i < questionsCount; i++) {
    let divisor = Math.floor(Math.random() * (maxDivisor - minDivisor + 1)) + minDivisor;
    let minValidDividend = Math.max(minDividend, divisor + 1);
    
    if (minValidDividend > maxDividend) {
      minValidDividend = minDividend;
    }

    let dividend = Math.floor(Math.random() * (maxDividend - minValidDividend + 1)) + minValidDividend;

    const details = computeLongDivisionSteps(dividend, divisor);

    problems.push({
      id: i + 1,
      dividend: dividend,
      divisor: divisor,
      quotient: details.quotient,
      remainder: details.remainder,
      steps: details.steps
    });
  }

  saveStateToLocalStorage();
  renderWorksheetDOM();
}

function onAnswerOptionChange() {
  saveStateToLocalStorage();
  renderWorksheetDOM();
}

function onSettingsChange() {
  saveStateToLocalStorage();
}

function resetToDefaults() {
  currentLineDigits = [3, 2];
  document.getElementById("numQuestions").value = "12";
  document.getElementById("answerOption").value = "no_answers";
  renderLineDigitInputs();
  generateNewQuestions();
}

function saveStateToLocalStorage() {
  const state = {
    currentLineDigits: currentLineDigits,
    numQuestions: document.getElementById("numQuestions").value,
    answerOption: document.getElementById("answerOption").value,
    problems: problems
  };
  localStorage.setItem("division_worksheet_state_v1", JSON.stringify(state));
}

function loadStateFromLocalStorage() {
  const saved = localStorage.getItem("division_worksheet_state_v1");
  if (saved) {
    try {
      const state = JSON.parse(saved);
      if (Array.isArray(state.currentLineDigits)) currentLineDigits = state.currentLineDigits;
      if (state.numQuestions) document.getElementById("numQuestions").value = state.numQuestions;
      if (state.answerOption) document.getElementById("answerOption").value = state.answerOption;
      if (Array.isArray(state.problems) && state.problems.length > 0) {
        problems = state.problems;
        return true;
      }
    } catch (e) {
      console.error("Local storage load error:", e);
    }
  }
  return false;
}

function renderWorksheetDOM() {
  // Dynamically calculate cell width based on dividend digits
  const maxDigits = currentLineDigits[0] || 3;
  let computedCellWidth = 26;
  if (maxDigits >= 7) {
    computedCellWidth = 18;
  } else if (maxDigits >= 5) {
    computedCellWidth = 21;
  }
  document.documentElement.style.setProperty('--digit-width', `${computedCellWidth}px`);

  const answerOption = document.getElementById("answerOption").value;
  const container = document.getElementById("worksheetContainer");
  container.innerHTML = "";

  const problemsPerPage = 6;
  const totalPages = Math.ceil(problems.length / problemsPerPage);

  for (let page = 0; page < totalPages; page++) {
    const pageProblems = problems.slice(page * problemsPerPage, (page + 1) * problemsPerPage);
    const sheet = document.createElement("div");
    sheet.className = "paper-sheet";
    if (page > 0) sheet.classList.add("page-break");

    sheet.innerHTML = `
      <div class="worksheet-header">
        <div class="worksheet-title">
          Long Division Worksheet
          ${totalPages > 1 ? `<span style="font-size:.82rem; font-weight:600;"> Page ${page + 1}/${totalPages}</span>` : ""}
        </div>
        <div class="student-info">
          <div>Name: ______________</div>
          <div>Date: ______________</div>
          <div>Score: ______</div>
        </div>
      </div>
      <div class="problems-grid">
        ${pageProblems.map((p, idx) => renderCard(p, answerOption === "show_answers", idx === 0 && page === 0, computedCellWidth)).join("")}
      </div>
    `;
    container.appendChild(sheet);
  }
}

function renderCard(p, showAnswers, isFirst, cellWidth) {
  return `
    <div class="problem-card">
      <div class="problem-num">${p.id}.</div>
      <div style="flex-grow: 1;">${renderCardContent(p, showAnswers, isFirst, cellWidth)}</div>
    </div>
  `;
}

function renderCardContent(p, showAnswers, isFirst, cellWidth) {
  const dividendString = String(p.dividend);
  let quotientDigits = "";

  if (showAnswers) {
    const qString = String(p.quotient);
    const qStartCol = dividendString.length - qString.length;
    quotientDigits = `<div class="quotient-grid" style="left: ${qStartCol * cellWidth}px;">`;
    for (let i = 0; i < qString.length; i++) {
      quotientDigits += `<div class="quotient-digit">${qString[i]}</div>`;
    }
    quotientDigits += `</div>`;
  }

  let divisorHTML = '';
  if (isFirst) {
    divisorHTML = `<input type="text" class="editable-divisor" value="${p.divisor}" onclick="this.select()" onchange="updateFirstDivisor(this.value)">`;
  } else {
    divisorHTML = p.divisor;
  }

  let dividendHTML = "";
  const dividendWidth = dividendString.length * cellWidth;
  if (isFirst) {
    dividendHTML = `<input type="text" class="editable-input" style="width: ${dividendWidth}px;" value="${p.dividend}" onclick="this.select()" onchange="updateFirstDividend(this.value)">`;
  } else {
    for (let i = 0; i < dividendString.length; i++) {
      dividendHTML += `<div class="digit-cell">${dividendString[i]}</div>`;
    }
  }

  let html = `
    <div class="long-division-container">
      <div class="division-header">${quotientDigits}</div>
      <div class="division-line">
        <div class="divisor">${divisorHTML}</div>
        <div class="dividend-area" style="width: ${dividendWidth}px;">
          <div class="digit-grid" ${isFirst ? `style="width: ${dividendWidth}px;"` : ''}>${dividendHTML}</div>
        </div>
      </div>
  `;

  if (showAnswers) {
    html += `<div class="work-area">`;

    p.steps.forEach((step) => {
      const productString = String(step.product);
      const productStart = step.startColumn;

      let productCellsHTML = "";
      for (let c = 0; c < productString.length; c++) {
        productCellsHTML += `<div class="step-cell">${productString[c]}</div>`;
      }

      html += `
        <div class="work-row subtraction-row">
          <div class="step-cells-container" style="left: ${productStart * cellWidth}px;">
            ${productCellsHTML}
          </div>
        </div>
      `;

      if (step.nextDigit !== null) {
        const nextValue = step.remainder * 10 + step.nextDigit;
        const nextString = String(nextValue);
        const nextStart = step.nextColumn - nextString.length + 1;

        let nextCellsHTML = "";
        for (let c = 0; c < nextString.length; c++) {
          nextCellsHTML += `<div class="step-cell">${nextString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${nextStart * cellWidth}px;">
              ${nextCellsHTML}
            </div>
          </div>
        `;
      } else {
        const remainderString = String(step.remainder);
        const remainderStart = dividendString.length - remainderString.length;

        let remCellsHTML = "";
        for (let c = 0; c < remainderString.length; c++) {
          remCellsHTML += `<div class="step-cell" style="color: #2563eb;">${remainderString[c]}</div>`;
        }

        html += `
          <div class="work-row">
            <div class="step-cells-container" style="left: ${remainderStart * cellWidth}px;">
              ${remCellsHTML}
            </div>
          </div>
        `;
      }
    });

    html += `
      </div>
      <div class="solution-summary">
        <div>Quotient = ${p.quotient}</div>
        <div>Remainder = ${p.remainder}</div>
      </div>
    `;
  } else {
    html += `<div style="height: 175px;"></div>`;
  }

  html += `</div>`;
  return html;
}

function updateFirstDivisor(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  problems[0].divisor = num;
  recomputeFirstProblem();
}

function updateFirstDividend(val) {
  let num = parseInt(val, 10);
  if (isNaN(num) || num <= 0) return;
  problems[0].dividend = num;
  recomputeFirstProblem();
}

function recomputeFirstProblem() {
  const details = computeLongDivisionSteps(problems[0].dividend, problems[0].divisor);
  problems[0].quotient = details.quotient;
  problems[0].remainder = details.remainder;
  problems[0].steps = details.steps;

  saveStateToLocalStorage();
  renderWorksheetDOM();
}

async function downloadPDF() {
  const element = document.getElementById("worksheetContainer");
  document.body.classList.add("pdf-mode");

  const inputs = element.querySelectorAll('input.editable-input, input.editable-divisor');
  const tempSpans = [];

  inputs.forEach(input => {
    const span = document.createElement('div');
    span.style.display = 'inline-block';
    
    if (input.classList.contains('editable-input')) {
      let cellsHTML = '';
      const valStr = String(input.value);
      for (let i = 0; i < valStr.length; i++) {
        cellsHTML += `<div class="digit-cell">${valStr[i]}</div>`;
      }
      span.innerHTML = `<div class="digit-grid">${cellsHTML}</div>`;
    } else if (input.classList.contains('editable-divisor')) {
      span.textContent = input.value;
      span.className = 'divisor';
      span.style.color = '#000';
    }

    input.parentNode.insertBefore(span, input);
    input.style.display = 'none';
    tempSpans.push({ input, span });
  });

  const options = {
    margin: 0,
    filename: "Long_Division_Worksheet.pdf",
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: "#ffffff" },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: ["css", "legacy"], before: ".page-break" }
  };

  try {
    await html2pdf().set(options).from(element).save();
  } catch (error) {
    console.error("PDF-generation error:", error);
    alert("PDF generation failed.");
  } finally {
    tempSpans.forEach(({ input, span }) => {
      input.style.display = '';
      span.remove();
    });
    document.body.classList.remove("pdf-mode");
  }
}

window.onload = function() {
  initQuestionDropdown();
  const hasSavedState = loadStateFromLocalStorage();
  renderLineDigitInputs();

  if (hasSavedState) {
    renderWorksheetDOM();
  } else {
    generateNewQuestions();
  }
};

</script>

</body>
</html>
