<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>English Alphabets App</title>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 980px;
            margin-top: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 8px 14px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s active;
            display: flex;
            align-items: center;
            gap: 5px;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-play { background-color: #2ecc71; }
        
        .btn-repeat { 
            background-color: #94a3b8; 
            opacity: 0.7;
        }
        .btn-repeat.active { 
            background-color: #10b981; 
            opacity: 1;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
        }

        .btn-stop { background-color: #e74c3c; display: none; }

        .section-label {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            background: #f8f9fa;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .mode-btn {
            background-color: #e2e8f0;
            color: #475569;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 5px;
        }

        .mode-btn.active {
            background-color: #8b5cf6;
            color: white;
            box-shadow: 0 2px 6px rgba(139, 92, 246, 0.4);
        }

        .columns-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .refresh-spinner {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            border: 3px solid #cbd5e1;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            z-index: 10;
            transition: top 0.2s ease, transform 0.1s linear;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-spinner.spinning {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            background: #fafafa;
            padding: 10px;
            min-height: 220px;
            max-height: 580px;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .letter-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
            touch-action: manipulation;
        }

        .letter-card:active {
            background-color: #e0f2fe;
        }

        /* Lighter & Softer Yellow Highlight */
        .letter-card.highlight {
            background-color: #fef08a !important;
            color: #1e293b !important;
            transform: scale(1.04);
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            border-color: #eab308;
        }

        .letter-symbol {
            font-size: 34px;
            font-weight: bold;
            color: #1e293b;
        }

        .letter-emoji {
            font-size: 72px;
            margin: 8px 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 76px;
        }

        .letter-word {
            font-size: 16px;
            font-weight: 700;
            color: #475569;
        }

        /* Fixed Exit Container */
        .exit-container {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom));
            right: 16px;
            z-index: 9999;
            display: none;
        }

        .btn-exit {
            background-color: #dc2626;
            color: #ffffff;
            padding: 9px 16px;
            border: 2px solid #ffffff;
            border-radius: 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .btn-exit:active {
            background-color: #b91c1c;
            transform: scale(0.94);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>English Alphabets (A to Z)</h2>
        
        <div class="controls">
            <button class="btn-play" id="playBtn" onclick="toggleAudio()">▶ Play</button>
            <button class="btn-repeat" id="repeatBtn" onclick="toggleRepeat()">🔁 Repeat</button>
            <button class="btn-stop" id="stopBtn" onclick="stopAudio()">⏹ Stop</button>
        </div>

        <div class="section-label">Category Filter</div>
        <div class="mode-container">
            <button class="mode-btn active" id="filterAllBtn" onclick="setCategoryFilter('all')">All (A-Z)</button>
            <button class="mode-btn" id="filterVowelsBtn" onclick="setCategoryFilter('vowels')">Vowels</button>
            <button class="mode-btn" id="filterConsonantsBtn" onclick="setCategoryFilter('consonants')">Consonants</button>
        </div>

        <div class="section-label">Speed Mode</div>
        <div class="mode-container">
            <button class="mode-btn" id="normalBtn" onclick="setSpeedMode('normal')">⚡ Normal Speed</button>
            <button class="mode-btn active" id="delayedBtn" onclick="setSpeedMode('delayed')">🐢 Delayed (1.5s Gap)</button>
        </div>

        <div class="columns-wrapper" id="columnsWrapper">
            <div class="refresh-spinner" id="refreshSpinner"></div>
            <div class="grid-container" id="output"></div>
        </div>
    </div>

    <div class="exit-container" id="exitContainer">
        <button class="btn-exit" onclick="exitApp()">✖ Exit</button>
    </div>

    <script>
        const alphabetsData = [
            { letter: 'A', word: 'Apple', fullText: 'A for Apple', type: 'vowels', emoji: '🍎' },
            { letter: 'B', word: 'Ball', fullText: 'B for Ball', type: 'consonants', emoji: '⚽' },
            { letter: 'C', word: 'Cat', fullText: 'C for Cat', type: 'consonants', emoji: '🐱' },
            { letter: 'D', word: 'Dog', fullText: 'D for Dog', type: 'consonants', emoji: '🐶' },
            { letter: 'E', word: 'Elephant', fullText: 'E for Elephant', type: 'vowels', emoji: '🐘' },
            { letter: 'F', word: 'Fish', fullText: 'F for Fish', type: 'consonants', emoji: '🐟' },
            { letter: 'G', word: 'Grapes', fullText: 'G for Grapes', type: 'consonants', emoji: '🍇' },
            { letter: 'H', word: 'Hen', fullText: 'H for Hen', type: 'consonants', emoji: '🐔' },
            { letter: 'I', word: 'Ice Cream', fullText: 'I for Ice Cream', type: 'vowels', emoji: '🍦' },
            { letter: 'J', word: 'Jug', fullText: 'J for Jug', type: 'consonants', emoji: '🏺' },
            { letter: 'K', word: 'Kite', fullText: 'K for Kite', type: 'consonants', emoji: '🪁' },
            { letter: 'L', word: 'Lion', fullText: 'L for Lion', type: 'consonants', emoji: '🦁' },
            { letter: 'M', word: 'Mango', fullText: 'M for Mango', type: 'consonants', emoji: '🥭' },
            { letter: 'N', word: 'Nest', fullText: 'N for Nest', type: 'consonants', emoji: '🪹' },
            { letter: 'O', word: 'Orange', fullText: 'O for Orange', type: 'vowels', emoji: '🍊' },
            { letter: 'P', word: 'Peacock', fullText: 'P for Peacock', type: 'consonants', emoji: '🦚' },
            { letter: 'Q', word: 'Queen', fullText: 'Q for Queen', type: 'consonants', emoji: '👸' },
            { letter: 'R', word: 'Rose', fullText: 'R for Rose', type: 'consonants', emoji: '🌹' },
            { letter: 'S', word: 'Ship', fullText: 'S for Ship', type: 'consonants', emoji: '🚢' },
            { letter: 'T', word: 'Tiger', fullText: 'T for Tiger', type: 'consonants', emoji: '🐯' },
            { letter: 'U', word: 'Umbrella', fullText: 'U for Umbrella', type: 'vowels', emoji: '☂️' },
            { letter: 'V', word: 'Van', fullText: 'V for Van', type: 'consonants', emoji: '🚐' },
            { letter: 'W', word: 'Watch', fullText: 'W for Watch', type: 'consonants', emoji: '⌚' },
            { letter: 'X', word: 'Xylophone', fullText: 'X for Xylophone', type: 'consonants', emoji: '🎼' },
            { letter: 'Y', word: 'Yak', fullText: 'Y for Yak', type: 'consonants', emoji: '🦬' },
            { letter: 'Z', word: 'Zebra', fullText: 'Zed for Zebra', type: 'consonants', emoji: '🦓' }
        ];

        let isSpeaking = false;
        let isRepeatActive = false;
        let currentFilteredList = [];
        let currentIndex = 0;
        let mode = 'delayed';
        let currentCategory = 'all';

        function checkAppEnvironment() {
            if (window.AndroidTTS && typeof window.AndroidTTS.exitApp === 'function') {
                const exitContainer = document.getElementById('exitContainer');
                if (exitContainer) {
                    exitContainer.style.display = 'block';
                }
            }
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            document.getElementById('filterAllBtn').classList.toggle('active', category === 'all');
            document.getElementById('filterVowelsBtn').classList.toggle('active', category === 'vowels');
            document.getElementById('filterConsonantsBtn').classList.toggle('active', category === 'consonants');
            generateAlphabets();
        }

        function setSpeedMode(selectedMode) {
            mode = selectedMode;
            document.getElementById('normalBtn').classList.toggle('active', mode === 'normal');
            document.getElementById('delayedBtn').classList.toggle('active', mode === 'delayed');
        }

        function toggleRepeat() {
            isRepeatActive = !isRepeatActive;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeatActive);
        }

        function generateAlphabets() {
            stopAudio();
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '';

            if (currentCategory === 'all') {
                currentFilteredList = alphabetsData;
            } else {
                currentFilteredList = alphabetsData.filter(item => item.type === currentCategory);
            }

            currentFilteredList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'letter-card';
                card.id = `card-${index}`;
                card.onclick = () => tapAndSelectLetter(index);

                card.innerHTML = `
                    <div class="letter-symbol">${item.letter}</div>
                    <div class="letter-emoji">${item.emoji}</div>
                    <div class="letter-word">${item.word}</div>
                `;

                outputDiv.appendChild(card);
            });
        }

        function speakItemNative(text, isDelayed) {
            if (window.AndroidTTS) {
                const speechRate = 0.85;
                window.AndroidTTS.speakItem(text, speechRate, isDelayed);
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-GB';
                u.rate = 0.85;
                u.onend = () => {
                    if (isSpeaking) {
                        setTimeout(() => {
                            window.onSpeechEnd();
                        }, isDelayed ? 1500 : 250);
                    }
                };
                u.onerror = () => {
                    if (isSpeaking) {
                        window.onSpeechEnd();
                    }
                };
                speechSynthesis.speak(u);
            }
        }

        function tapAndSelectLetter(index) {
            stopAudioOnly();
            currentIndex = index;

            isSpeaking = false;
            document.getElementById('playBtn').innerText = '▶ Play';
            document.getElementById('stopBtn').style.display = 'none';

            highlightLetter(index);
            speakItemNative(currentFilteredList[index].fullText, false);
        }

        function highlightLetter(index) {
            document.querySelectorAll('.letter-card.highlight').forEach(el => el.classList.remove('highlight'));
            const activeElem = document.getElementById(`card-${index}`);
            if (activeElem) {
                activeElem.classList.add('highlight');
                
                const container = document.getElementById('output');
                if (container) {
                    const elemRect = activeElem.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    
                    const scrollTopTarget = container.scrollTop + (elemRect.top - containerRect.top) - (container.clientHeight / 2) + (elemRect.height / 2);

                    container.scrollTo({
                        top: scrollTopTarget,
                        behavior: 'smooth'
                    });
                }
            }
        }

        function toggleAudio() {
            if (isSpeaking) {
                pauseAudio();
            } else {
                startAudio();
            }
        }

        function startAudio() {
            if (currentFilteredList.length === 0) return;

            if (currentIndex >= currentFilteredList.length) {
                currentIndex = 0;
            }

            isSpeaking = true;
            document.getElementById('playBtn').innerText = '⏸ Pause';
            document.getElementById('stopBtn').style.display = 'inline-flex';

            playCurrentLetter();
        }

        function playCurrentLetter() {
            if (!isSpeaking) return;

            if (currentIndex >= currentFilteredList.length) {
                if (isRepeatActive) {
                    currentIndex = 0;
                } else {
                    stopAudio();
                    return;
                }
            }

            const currentItem = currentFilteredList[currentIndex];
            highlightLetter(currentIndex);

            const isDelayed = (mode === 'delayed');
            speakItemNative(currentItem.fullText, isDelayed);
        }

        window.onSpeechEnd = function() {
            if (!isSpeaking) return;
            currentIndex++;
            playCurrentLetter();
        };

        function stopAudioOnly() {
            if (window.AndroidTTS) {
                window.AndroidTTS.stop();
            }
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        }

        function pauseAudio() {
            isSpeaking = false;
            stopAudioOnly();
            document.getElementById('playBtn').innerText = '▶ Play';
        }

        function stopAudio() {
            isSpeaking = false;
            stopAudioOnly();

            currentIndex = 0;
            document.getElementById('playBtn').innerText = '▶ Play';
            document.getElementById('stopBtn').style.display = 'none';

            document.querySelectorAll('.letter-card.highlight').forEach(el => el.classList.remove('highlight'));
        }

        function exitApp() {
            stopAudio();
            if (window.AndroidTTS && window.AndroidTTS.exitApp) {
                window.AndroidTTS.exitApp();
            } else {
                window.close();
            }
        }

        function resetAudio() {
            stopAudio();
            generateAlphabets();
        }

        // Pull-to-refresh Gesture
        let touchStartY = 0;
        let isPulling = false;
        const outputContainer = document.getElementById('output');
        const refreshSpinner = document.getElementById('refreshSpinner');

        outputContainer.addEventListener('touchstart', (e) => {
            if (outputContainer.scrollTop === 0) {
                touchStartY = e.touches[0].clientY;
                isPulling = true;
            } else {
                isPulling = false;
            }
        }, { passive: true });

        outputContainer.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            let touchCurrentY = e.touches[0].clientY;
            let pullDistance = touchCurrentY - touchStartY;

            if (pullDistance > 0 && outputContainer.scrollTop === 0) {
                let offset = Math.min(pullDistance * 0.4, 70);
                refreshSpinner.style.top = `${offset - 40}px`;
                refreshSpinner.style.transform = `translateX(-50%) rotate(${pullDistance * 2}deg)`;
            }
        }, { passive: true });

        outputContainer.addEventListener('touchend', (e) => {
            if (!isPulling) return;
            isPulling = false;
            let touchEndY = e.changedTouches[0].clientY;
            let pullDistance = touchEndY - touchStartY;

            if (outputContainer.scrollTop === 0 && pullDistance > 80) {
                refreshSpinner.style.top = "12px";
                refreshSpinner.classList.add('spinning');

                setTimeout(() => {
                    resetAudio();
                    refreshSpinner.style.top = "-40px";
                    refreshSpinner.classList.remove('spinning');
                }, 600);
            } else {
                refreshSpinner.style.top = "-40px";
                refreshSpinner.classList.remove('spinning');
            }
        }, { passive: true });

        window.addEventListener('DOMContentLoaded', () => {
            generateAlphabets();
            checkAppEnvironment();
        });
    </script>
</body>
</html>
