<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtraction Worksheet Generator</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-workspace: #ffffff;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-workspace);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 40px;
      overflow-x: hidden;
      width: 100%;
    }

    /* Top Controls Panel Header */
    .controls-panel {
      background: #ffffff;
      padding: 16px;
      border-bottom: 2px solid #e2e8f0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      letter-spacing: -0.3px;
      width: 100%;
    }

    .controls-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 130px;
    }

    .form-group label.group-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group select {
      padding: 8px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
      width: 100%;
    }

    .form-group select:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .line-digits-group {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1.5px solid #cbd5e1;
      min-height: 38px;
      flex-wrap: wrap;
    }

    .line-digit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
    }

    .line-digit-item span {
      font-size: 0.68rem;
      font-weight: 700;
      color: #64748b;
    }

    .line-digit-item select {
      min-width: 50px;
      padding: 4px 2px;
      text-align: center;
      font-size: 0.82rem;
      width: 100%;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 700px;
      margin-top: 2px;
    }

    .btn {
      flex: 1 1 calc(50% - 10px);
      max-width: 180px;
      min-width: 110px;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      white-space: nowrap;
      text-align: center;
    }

    @media (min-width: 640px) {
      .btn {
        flex: 0 0 auto;
        min-width: 120px;
      }
    }

    .btn-generate { background: var(--primary); color: white; }
    .btn-generate:hover { background: var(--primary-hover); }

    .btn-reset { background: #64748b; color: white; }
    .btn-reset:hover { background: #475569; }

    #worksheetContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 10px 15px;
    }

    .paper-sheet {
      width: 100%;
      max-width: 1200px;
      background: #ffffff;
      padding: 15mm;
      margin: 10px auto;
      box-shadow: none;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      box-sizing: border-box;
      position: relative;
    }

    .worksheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .worksheet-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #000;
    }

    /* Flexible Grid: Auto-fits more items in landscape mode */
    .problems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 24px 16px;
      justify-items: center;
      width: 100%;
    }

    .problem-card {
      display: flex;
      gap: 4px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      width: 100%;
      justify-content: flex-start;
      color: #000;
      padding-left: 2px;
      box-sizing: border-box;
    }

    .problem-num {
      font-size: 0.85rem;
      color: #334155;
      min-width: 22px;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .math-block {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      width: auto;
      max-width: calc(100% - 24px);
    }

    .digits-1-3 { font-size: 1.3rem; }
    .digits-4   { font-size: 1.15rem; }
    .digits-5   { font-size: 1.05rem; }
    .digits-6   { font-size: 0.95rem; }
    .digits-7   { font-size: 0.88rem; }
    .digits-8   { font-size: 0.80rem; }

    .digits-1-3 .number-row { letter-spacing: 2px; }
    .digits-4 .number-row   { letter-spacing: 1.5px; }
    .digits-5 .number-row   { letter-spacing: 1px; }
    .digits-6 .number-row   { letter-spacing: 0.5px; }
    .digits-7 .number-row   { letter-spacing: 0px; }
    .digits-8 .number-row   { letter-spacing: -0.5px; }

    .number-row {
      text-align: right;
      width: 100%;
      padding-right: 2px;
      white-space: nowrap;
    }

    .number-row.bottom {
      position: relative;
      padding-left: 1.2em;
      padding-bottom: 3px;
      margin-bottom: 3px;
      width: 100%;
      border-bottom: 2px solid #000000;
    }

    .number-row.bottom::before {
      content: "-";
      position: absolute;
      left: 0;
      bottom: 1px;
      font-weight: bold;
      font-size: 1.2em;
      line-height: 1;
    }

    .answer {
      color: #1d4ed8;
      text-align: right;
      width: 100%;
      padding-right: 2px;
      min-height: 1.3em;
      font-weight: 800;
      margin-top: 2px;
      border-bottom: 2px solid #000000;
      padding-bottom: 2px;
      white-space: nowrap;
    }

    .answer.hidden {
      color: transparent;
    }

    .page-break {
      page-break-before: always;
      break-before: page;
    }

    @media (max-width: 640px) {
      .app-title { font-size: 1.15rem; }
      .paper-sheet { padding: 10mm 6mm; }
      .worksheet-title { font-size: 1.1rem; }
      .controls-panel { padding: 12px 10px; }
    }

    /* Print settings optimized for landscape and portrait with no background shadows */
    @media print {
      @page {
        size: auto;
        margin: 10mm;
      }
      .no-print { display: none !important; }
      body { background: #ffffff !important; padding: 0 !important; }
      .paper-sheet {
        width: 100% !important;
        max-width: none !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 5mm !important;
      }
      .problems-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 20px 12px;
      }
      .page-break {
        page-break-before: always !important;
        break-before: page !important;
      }
      .answer { color: #000000 !important; }
      .problem-num { color: #000000 !important; }
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls-panel no-print">
    
    <h1 class="app-title">Subtraction Worksheet Generator</h1>

    <div class="controls-wrapper">
      <!-- Digits Per Line Controls -->
      <div class="form-group">
        <label class="group-label">Digits Per Line:</label>
        <div id="lineDigitsContainer" class="line-digits-group"></div>
      </div>

      <!-- Regrouping Dropdown -->
      <div class="form-group">
        <label class="group-label" for="groupingMode">Regrouping (Borrow):</label>
        <select id="groupingMode" onchange="saveSettings()">
          <option value="no_borrow" selected>Without Borrowing</option>
          <option value="with_borrow">With Borrowing</option>
          <option value="any">Mixed</option>
        </select>
      </div>

      <!-- Questions Count Dropdown -->
      <div class="form-group">
        <label class="group-label" for="numQuestions">No. of Questions:</label>
        <select id="numQuestions" onchange="saveSettings()">
          <!-- Dynamic Options -->
        </select>
      </div>

      <!-- Answer Options Dropdown -->
      <div class="form-group">
        <label class="group-label" for="answerOption">Answer Options:</label>
        <select id="answerOption" onchange="updateAnswerDisplay()">
          <option value="no_answers" selected>No Answers</option>
          <option value="inline">Show Answers</option>
        </select>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button class="btn btn-generate" onclick="generateNewQuestions()">Generate New</button>
      <button class="btn btn-reset" onclick="resetToDefaults()">Reset</button>
    </div>

  </div>

  <!-- Printable Container -->
  <div id="worksheetContainer"></div>

  <script>
    let currentLineDigits = [2, 2];
    let generatedProblems = [];

    function initQuestionDropdown() {
      const qSelect = document.getElementById('numQuestions');
      qSelect.innerHTML = '';
      for (let i = 3; i <= 60; i += 3) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i} Questions`;
        if (i === 24) opt.selected = true;
        qSelect.appendChild(opt);
      }
    }

    function renderLineDigitInputs() {
      const container = document.getElementById('lineDigitsContainer');
      container.innerHTML = '';

      if (currentLineDigits[1] > currentLineDigits[0]) {
        currentLineDigits[1] = currentLineDigits[0];
      }

      currentLineDigits.forEach((digits, index) => {
        const item = document.createElement('div');
        item.className = 'line-digit-item';
        
        let optionsHtml = '';
        const maxLimit = (index === 1) ? currentLineDigits[0] : 7;
        
        for (let d = 1; d <= 7; d++) {
          if (index === 1 && d > maxLimit) break;
          optionsHtml += `<option value="${d}" ${d === digits ? 'selected' : ''}>${d} Digit${d > 1 ? 's' : ''}</option>`;
        }

        item.innerHTML = `
          <span>${index === 0 ? 'Top' : 'Bottom'}</span>
          <select onchange="updateLineDigitVal(${index}, this.value)">
            ${optionsHtml}
          </select>
        `;
        container.appendChild(item);
      });
    }

    function updateLineDigitVal(index, value) {
      const val = parseInt(value) || 1;
      currentLineDigits[index] = val;
      if (index === 0 && currentLineDigits[1] > currentLineDigits[0]) {
        currentLineDigits[1] = currentLineDigits[0];
      }
      renderLineDigitInputs();
      saveSettings();
    }

    function saveSettings() {
      const settings = {
        lineDigits: currentLineDigits,
        groupingMode: document.getElementById('groupingMode').value,
        numQuestions: document.getElementById('numQuestions').value,
        answerOption: document.getElementById('answerOption').value
      };
      localStorage.setItem('subtraction_worksheet_settings_v4', JSON.stringify(settings));
    }

    function loadSavedChoices() {
      const saved = localStorage.getItem('subtraction_worksheet_settings_v4');
      if (saved) {
        try {
          const settings = JSON.parse(saved);
          if (Array.isArray(settings.lineDigits)) currentLineDigits = settings.lineDigits;
          if (settings.groupingMode) document.getElementById('groupingMode').value = settings.groupingMode;
          if (settings.numQuestions) document.getElementById('numQuestions').value = settings.numQuestions;
          
          if (settings.answerOption && settings.answerOption !== 'separate') {
            document.getElementById('answerOption').value = settings.answerOption;
          } else {
            document.getElementById('answerOption').value = 'no_answers';
          }
        } catch(e) {
          console.error("Failed to load saved settings", e);
        }
      }
      renderLineDigitInputs();
    }

    function getRandomNumber(digits) {
      if (digits === 1) return Math.floor(Math.random() * 9) + 1;
      const min = Math.pow(10, digits - 1);
      const max = Math.pow(10, digits) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function requiresBorrowing(top, bottom) {
      let tStr = String(top).split('').reverse();
      let bStr = String(bottom).split('').reverse();
      let maxLen = Math.max(tStr.length, bStr.length);

      for (let i = 0; i < maxLen; i++) {
        let tDigit = parseInt(tStr[i] || '0');
        let bDigit = parseInt(bStr[i] || '0');
        if (tDigit < bDigit) return true;
      }
      return false;
    }

    function generateProblemForMode(digitsArr, mode) {
      const topDigits = digitsArr[0];
      const bottomDigits = digitsArr[1];

      for (let attempt = 0; attempt < 500; attempt++) {
        let top = getRandomNumber(topDigits);
        let bottom = getRandomNumber(bottomDigits);

        if (top < bottom) [top, bottom] = [bottom, top];

        const isBorrow = requiresBorrowing(top, bottom);

        if (mode === 'any') return { top, bottom };
        if (mode === 'no_borrow' && !isBorrow) return { top, bottom };
        if (mode === 'with_borrow' && isBorrow) return { top, bottom };
      }

      let top = getRandomNumber(topDigits);
      let bottom = getRandomNumber(bottomDigits);
      if (top < bottom) [top, bottom] = [bottom, top];
      return { top, bottom };
    }

    function padZeroes(num, targetLength) {
      let str = String(num);
      while (str.length < targetLength) {
        str = '0' + str;
      }
      return str;
    }

    function generateNewQuestions() {
      saveSettings();
      const questionsCount = parseInt(document.getElementById('numQuestions').value) || 24;
      const groupingMode = document.getElementById('groupingMode').value;

      generatedProblems = [];
      for (let i = 0; i < questionsCount; i++) {
        const { top, bottom } = generateProblemForMode(currentLineDigits, groupingMode);
        const diff = top - bottom;
        
        const topLength = currentLineDigits[0];
        const paddedTop = padZeroes(top, topLength);
        const paddedBottom = padZeroes(bottom, topLength);
        const paddedDiff = padZeroes(diff, topLength);

        generatedProblems.push({ id: i + 1, top: paddedTop, bottom: paddedBottom, diff: paddedDiff });
      }

      renderWorksheetUI();
    }

    function updateAnswerDisplay() {
      saveSettings();
      renderWorksheetUI();
    }

    function renderWorksheetUI() {
      const container = document.getElementById('worksheetContainer');
      container.innerHTML = '';

      if (generatedProblems.length === 0) return;

      const answerOption = document.getElementById('answerOption').value;
      
      const mainSheet = document.createElement('div');
      mainSheet.className = 'paper-sheet';
      mainSheet.innerHTML = `
        <div class="worksheet-header">
          <div class="worksheet-title">Subtraction Worksheet Generator</div>
        </div>
        <div class="problems-grid">
          ${generatedProblems.map(p => renderProblemCard(p, answerOption === 'inline')).join('')}
        </div>
      `;
      container.appendChild(mainSheet);
    }

    function renderProblemCard(p, showAnswer) {
      const maxLen = Math.max(String(p.top).length, String(p.bottom).length, String(p.diff).length);
      
      let sizeClass = 'digits-1-3';
      if (maxLen === 4) sizeClass = 'digits-4';
      else if (maxLen === 5) sizeClass = 'digits-5';
      else if (maxLen === 6) sizeClass = 'digits-6';
      else if (maxLen === 7) sizeClass = 'digits-7';
      else if (maxLen >= 8) sizeClass = 'digits-8';

      return `
        <div class="problem-card">
          <span class="problem-num">${p.id})</span>
          <div class="math-block ${sizeClass}">
            <div class="number-row">${p.top}</div>
            <div class="number-row bottom">${p.bottom}</div>
            <div class="answer ${showAnswer ? '' : 'hidden'}">${p.diff}</div>
          </div>
        </div>
      `;
    }

    function resetToDefaults() {
      currentLineDigits = [2, 2];
      document.getElementById('groupingMode').value = "no_borrow";
      document.getElementById('numQuestions').value = "24";
      document.getElementById('answerOption').value = "no_answers";
      renderLineDigitInputs();
      generateNewQuestions();
    }

    window.onload = function() {
      initQuestionDropdown();
      loadSavedChoices();
      generateNewQuestions();
    };
  </script>
</body>
</html>
