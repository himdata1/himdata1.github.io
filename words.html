<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Word Learning Grid - हिंदी शब्द ग्रिड</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007bff'/><text x='50' y='52' font-size='68' fill='white' font-family='Verdana, sans-serif' font-weight='900' text-anchor='middle' dominant-baseline='central'>W</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007bff'/><text x='50' y='52' font-size='68' fill='white' font-family='Verdana, sans-serif' font-weight='900' text-anchor='middle' dominant-baseline='central'>W</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f4f0;
            min-height: 100vh;
            padding: 20px 10px 60px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 5px;
            text-align: center;
            font-size: 22px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }

        .controls {
            background-color: #ffffff;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            max-width: 980px;
            width: 100%;
            position: sticky;
            top: 5px;
            z-index: 100;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-primary {
            background-color: #2e7d32;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1b5e20;
        }

        .btn-play {
            background-color: #0288d1;
            color: white;
        }

        .btn-play:hover {
            background-color: #01579b;
        }

        .btn-pause-resume {
            background-color: #ff9800;
            color: white;
        }

        .btn-pause-resume:hover {
            background-color: #e68a00;
        }

        .btn-repeat {
            background-color: #e0e0e0;
            color: #757575;
            border: 1px solid #ccc;
        }

        .btn-repeat.active {
            background-color: #4caf50 !important;
            color: white !important;
            border: 1px solid #388e3c;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d5d5d5;
        }

        .btn-danger {
            background-color: #d32f2f;
            color: white;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .btn-random {
            background-color: #ff9800;
            color: white;
        }

        .btn-random:hover {
            background-color: #e68a00;
        }

        .btn-active {
            outline: 3px solid #ff9800;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #333;
        }

        .setting-group select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
            outline: none;
        }

        /* Grid Layout */
        .grid-container {
            width: 100%;
            max-width: 800px;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-bottom: 1px solid #222;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row:nth-child(odd) {
            background-color: #72db35;
        }

        .row:nth-child(even) {
            background-color: #c0e89b;
        }

        .card {
            border-right: 1px solid #222;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.1s ease, filter 0.2s, background-color 0.2s ease;
            scroll-margin-top: 180px;
        }

        .card:last-child {
            border-right: none;
        }

        .row:nth-child(4n+1) .card,
        .row:nth-child(4n+3) .card {
            color: #0d0d0d;
        }

        .row:nth-child(4n+2) .card,
        .row:nth-child(4n+4) .card {
            color: #e50000;
        }

        .card:hover {
            filter: brightness(0.92);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.speaking {
            background-color: #fff9c4 !important;
            color: #000000 !important;
            animation: pulse 0.6s infinite alternate;
            outline: 4px solid #fbc02d;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .card-input-wrapper {
            position: relative;
            width: 90%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-input {
            width: 100%;
            height: 100%;
            border: 2px dashed #000;
            background: rgba(255, 255, 255, 0.95);
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            outline: none;
            padding-right: 18px;
        }

        .delete-card-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ff1744;
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Essay / Single Text Container */
        .essay-container {
            width: 100%;
            max-width: 800px;
            margin-top: 25px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .essay-container h3 {
            color: #2e7d32;
            font-size: 16px;
        }

        .essay-textbox {
            width: 100%;
            min-height: 90px;
            max-height: 350px;
            padding: 12px;
            font-size: 19px;
            line-height: 1.8;
            border: 2px solid #a5d6a7;
            background-color: #fafafa;
            border-radius: 8px;
            outline: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            scroll-margin-top: 200px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .essay-textbox:focus {
            border-color: #2e7d32;
            background-color: #ffffff;
        }

        .essay-sentence {
            display: inline;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            scroll-margin: 120px;
        }

        .essay-sentence.active-sentence {
            background-color: #fff9c4 !important;
            color: #000000 !important;
            font-weight: bold;
            outline: 2px solid #fbc02d;
        }

        .essay-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .card {
                height: 52px;
                font-size: 18px;
                scroll-margin-top: 260px;
            }
            .controls {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <h1>हिंदी शब्द उच्चारण अभ्यास</h1>
    <p class="subtitle">किसी भी शब्द पर क्लिक करके उच्चारण सुनें</p>

    <div class="controls">
        <button id="modeToggleBtn" class="btn btn-primary" onclick="toggleEditMode()">
            ✏️ Edit Mode: OFF
        </button>

        <button id="playBtn" class="btn btn-play" onclick="togglePlayAll()">
            ▶️ Play All
        </button>

        <!-- Extra Pause / Resume Button for Grid -->
        <button id="pauseResumeBtn" class="btn btn-pause-resume" onclick="togglePauseResume()" style="display: none;">
            ⏸️ Pause
        </button>

        <button id="repeatBtn" class="btn btn-repeat" onclick="toggleRepeat()">
            🔁 Repeat
        </button>

        <div class="setting-group">
            <label for="delayModeSelect">Mode:</label>
            <select id="delayModeSelect">
                <option value="normal" selected>Normal</option>
                <option value="delayed">Delayed (1.5s)</option>
            </select>
        </div>

        <div class="setting-group">
            <select id="matraSelect">
                <option value="no_matra">बिना मात्रा</option>
                <option value="aa_matra">आ (ा)</option>
                <option value="i_matra">इ (ि)</option>
                <option value="ee_matra">ई (ी)</option>
                <option value="u_matra">उ (ु)</option>
                <option value="oo_matra">ऊ (ू)</option>
                <option value="ri_matra">ऋ (ृ)</option>
                <option value="e_matra">ए (े)</option>
                <option value="ai_matra">ऐ (ै)</option>
                <option value="o_matra">ओ (ो)</option>
                <option value="au_matra">औ (ौ)</option>
                <option value="am_matra">अं (ं)</option>
                <option value="ah_matra">अः (ः)</option>
            </select>
        </div>

        <button class="btn btn-random" onclick="generateRandomWords()">
            🎲 Random
        </button>

        <button id="clearAllBtn" class="btn btn-danger" style="display:none;" onclick="clearAllWords()">
            🧹 Clear All
        </button>

        <button class="btn btn-secondary" onclick="addRow()">
            ➕ Row
        </button>

        <button class="btn btn-danger" onclick="deleteLastRow()">
            🗑️ Del Row
        </button>

        <button class="btn btn-secondary" onclick="resetToDefault()">
            🔄 Reset
        </button>

        <div class="setting-group">
            <label for="speedSelect">Grid Speed:</label>
            <select id="speedSelect">
                <option value="0.6">Slow</option>
                <option value="0.8" selected>Normal</option>
                <option value="1.0">Fast</option>
            </select>
        </div>
    </div>

    <div id="gridContainer" class="grid-container"></div>

    <!-- Essay / Long Text Reader Section -->
    <div class="essay-container">
        <h3>निबंध / लंबा पाठ वाचन (Essay / Long Text Reader)</h3>
        
        <!-- Editable Text Box -->
        <div id="essayBox" class="essay-textbox" contenteditable="true" onfocus="handleEssayFocus(this)">यहाँ हिंदी का कोई भी लंबा पाठ, अनुच्छेद या निबंध लिख सकते हैं। छात्र इसे आसानी से वाक्यों के प्राकृतिक प्रवाह में सुन सकते हैं और दोहरा सकते हैं।</div>

        <div class="essay-controls">
            <button id="essayPlayStopBtn" class="btn btn-play" onclick="toggleEssayPlayStop()">
                ▶️ Play
            </button>
            
            <!-- Repeat Button for Essay -->
            <button id="essayRepeatBtn" class="btn btn-repeat" onclick="toggleEssayRepeat()">
                🔁 Repeat
            </button>

            <div class="setting-group">
                <label for="essaySpeedSelect">Reading Speed:</label>
                <select id="essaySpeedSelect" onchange="updateEssaySpeed()">
                    <option value="0.6">Slow (0.6x)</option>
                    <option value="0.8" selected>Normal (0.8x)</option>
                    <option value="1.0">Fast (1.0x)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const defaultWords = [
            ["कल", "तप", "चढ़", "जग", "कब", "पल"],
            ["मग", "वक", "गप", "चर", "जब", "फल"],
            ["हल", "नल", "तल", "मन", "अब", "उस"],
            ["सब", "यज्ञ", "घन", "छल", "दस", "छत"],
            ["यश", "डर", "पढ़", "خत", "नस", "एक"],
            ["इत्र", "नग", "पर", "बल", "दल", "नथ"],
            ["टब", "ठग", "तन", "थन", "दम", "बस"],
            ["धन", "भग", "रस", "लट", "हम", "कर"],
            ["मत", "नभ", "चख", "सच", "नच", "गज"]
        ];

        const wordDictionary = {
            no_matra: ["कल", "तप", "चढ़", "जग", "कब", "पल", "मग", "वक", "गप", "चर", "जब", "फल", "हल", "नल", "तल", "मन", "अब", "उस", "सब", "यज्ञ", "घन", "छल", "दस", "छत", "यश", "डर", "पढ़", "खत", "नस", "एक", "इत्र", "नग", "पर", "बल", "दल", "नथ", "टब", "ठग", "तन", "थन", "दम", "बस", "धन", "भग", "रस", "लट", "हम", "कर", "मत", "नभ", "चख", "सच", "नच", "गज"],
            aa_matra: ["आम", "नाम", "काम", "धाम", "राम", "शाम", "काका", "मामा", "पापा", "नाना", "बाबा", "दाल", "गाल", "बाल", "खाल", "छाल", "जाल", "हाल", "रात", "बात", "जात", "मात", "सात", "हाथ", "कान", "पान", "दान", "मान", "थान", "छाता", "माता", "राजा", "बाजा", "ताजा", "मजा", "आना", "जाना", "खाना", "गाना", "लाना", "सोना", "चावल", "बादल", "काजल", "पागल"],
            i_matra: ["दिन", "गिन", "पिन", "बिन", "छिन", "सिर", "फिर", "दिल", "मिल", "खिल", "तिल", "बिल", "कवि", "रवि", "छवि", "गति", "पति", "मति", "अति", "किताब", "हिसाब", "किसान", "विमान", "शिकार", "सितार", "गिटार", "मित्र", "चित्र", "शिक्षा", "नियम", "किरण", "हिरण", "दिशा"],
            ee_matra: ["कील", "झील", "चील", "नील", "मील", "पानी", "नानी", "दादी", "चाची", "मामी", "तीर", "वीर", "खीर", "नीर", "शरीर", "हाथी", "साथी", "मीठा", "सीधा", "नीला", "पीला", "काला", "चाबी", "परी", "हरी", "दही", "सही", "दीदी", "सीटी", "लड़की", "बकरी", "मछली"],
            u_matra: ["कुल", "धुल", "पुल", "गुल", "सुन", "धुन", "बुना", "चुना", "दुआ", "सुख", "दुख", "मुख", "गुरु", "साधु", "पशु", "गुलाब", "साबुन", "दुकान", "मकान", "चतुर", "सुमन", "कुसुम", "कुटिया", "पुड़िया", "चुहिया", "बुलबुल"],
            oo_matra: ["फूल", "धूल", "भूल", "शूल", "मूल", "आलू", "भालू", "चालू", "चाकू", "डाकू", "काजू", "बाजू", "तराजू", "धूप", "रूप", "कूप", "सूप", "चूहा", "सूखा", "भूखा", "झूला", "पूजा", "दूजा", "सूरज", "मूरत", "खजूर", "नाखून", "अमरूद"],
            ri_matra: ["नृप", "मृग", "गृह", "तृण", "वृष", "अमृत", "ऋषि", "कृपाल", "कृषक", "सृजन", "मातृ", "पितृ", "कृपा", "दृष्टि", "वृक्ष"],
            e_matra: ["केला", "मेला", "ठेला", "पेड़", "शेर", "बेर", "घेर", "देश", "भेष", "केश", "रेखा", "सेना", "मेवा", "सेवा", "खेल", "मेल", "रेल", "ठेस", "चेला", "मेज़", "जेब", "रेत"],
            ai_matra: ["बैल", "मैल", "सैल", "तैर", "पैर", "गैर", "चैन", "जैसा", "पैसा", "वैसा", "कैसा", "मैदान", "कैद", "सैनिक", "दैनिक", "बैठक", "फैलाव", "फैशन", "तैयार", "पैदल"],
            o_matra: ["मोर", "चोर", "शोर", "ओर", "छोर", "ढोल", "बोल", "खोल", "गोल", "मोल", "कोट", "चोट", "मोटा", "छोटा", "खोटा", "होता", "धोबी", "गोभी", "लोभी", "कोयल", "बोतल", "जोकर", "ढोलक"],
            au_matra: ["मौन", "कौन", "फौज", "मौज", "चौका", "मौका", "दौलत", "चौपाल", "पकौड़ी", "हथौड़ा", "खिलौना", "बिछौना", "नौका", "सौदा", "रौनक", "चौकी", "चौराहा", "कौआ"],
            am_matra: ["रंग", "संग", "जंग", "मंग", "पतंग", "बंजर", "कंठ", "चंदन", "कंगन", "मंजन", "पंडित", "मंदिर", "सुंदर", "बंदर", "अंगूर", "अंडा", "हंस", "पंख", "शंख", "गंगा", "चंपा"],
            ah_matra: ["स्वतः", "प्रायः", "नमः", "अंततः", "मूलतः", "विशेषतः", "पूर्णतः", "क्रमशः", "दुःख", "निःसंकोच", "निःस्वार्थ"]
        };

        let wordData = [];
        let isEditMode = false;
        let selectedVoice = null;

        // Grid Playback States
        let isPlaying = false;
        let isPaused = false;
        let isRepeatOn = false;
        let playIndex = 0;
        let flatCards = [];
        let playbackTimer = null;
        let currentUtterance = null;
        let lastSpokenCard = null;

        // Essay Playback States
        let essayState = 'STOPPED'; // 'STOPPED', 'PLAYING'
        let essayRepeatOn = false;
        let essaySentences = [];
        let essaySentenceIndex = 0;
        let originalTextCache = '';
        let essayTimer = null;

        function initSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    const voices = window.speechSynthesis.getVoices();
                    selectedVoice = voices.find(voice => voice.lang.includes('hi') || voice.lang.includes('HI')) || null;
                };
            }
        }

        function loadWords() {
            const saved = localStorage.getItem('hindi_words_grid');
            if (saved) {
                try {
                    wordData = JSON.parse(saved);
                } catch (e) {
                    wordData = JSON.parse(JSON.stringify(defaultWords));
                }
            } else {
                wordData = JSON.parse(JSON.stringify(defaultWords));
            }
        }

        function saveWords() {
            localStorage.setItem('hindi_words_grid', JSON.stringify(wordData));
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            flatCards = [];

            wordData.forEach((row, rowIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                row.forEach((word, colIndex) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';

                    if (isEditMode) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'card-input-wrapper';

                        const inputEl = document.createElement('input');
                        inputEl.type = 'text';
                        inputEl.className = 'card-input';
                        inputEl.value = word;
                        
                        inputEl.onfocus = () => inputEl.select();
                        
                        inputEl.oninput = (e) => {
                            wordData[rowIndex][colIndex] = e.target.value;
                            saveWords();
                        };

                        const delBtn = document.createElement('button');
                        delBtn.className = 'delete-card-btn';
                        delBtn.innerHTML = '✕';
                        delBtn.title = 'Clear word';
                        delBtn.onclick = (e) => {
                            e.stopPropagation();
                            wordData[rowIndex][colIndex] = '';
                            saveWords();
                            renderGrid();
                        };

                        wrapper.appendChild(inputEl);
                        wrapper.appendChild(delBtn);
                        cardEl.appendChild(wrapper);
                    } else {
                        cardEl.textContent = word;
                        cardEl.onclick = () => {
                            stopAllPlayback();
                            speakSingleWord(word, cardEl);
                        };
                    }

                    rowEl.appendChild(cardEl);
                    flatCards.push({ element: cardEl, word: word });
                });

                container.appendChild(rowEl);
            });
        }

        function scrollToCardCenter(element) {
            if (!element) return;
            element.scrollIntoView({
                behavior: 'smooth',
                block: 'center',
                inline: 'nearest'
            });
        }

        function speakSingleWord(text, cardElement) {
            if (!text || text.trim() === '' || isEditMode) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 0.8;

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            currentUtterance = utterance;

            if (cardElement) {
                if (lastSpokenCard) lastSpokenCard.classList.remove('speaking');
                cardElement.classList.add('speaking');
                scrollToCardCenter(cardElement);
                lastSpokenCard = cardElement;
            }

            utterance.onend = () => {
                if (!isPlaying && cardElement) {
                    cardElement.classList.remove('speaking');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function toggleRepeat() {
            isRepeatOn = !isRepeatOn;
            const repeatBtn = document.getElementById('repeatBtn');
            if (isRepeatOn) {
                repeatBtn.classList.add('active');
            } else {
                repeatBtn.classList.remove('active');
            }
        }

        // Grid Play All Toggle Button
        function togglePlayAll() {
            if (isEditMode) return;
            stopEssayPlayback();
            
            if (isPlaying) {
                stopPlayback();
            } else {
                if (flatCards.length === 0) return;
                isPlaying = true;
                isPaused = false;
                playIndex = 0;
                document.getElementById('playBtn').innerHTML = '⏹️ Stop All';
                document.getElementById('pauseResumeBtn').style.display = 'inline-flex';
                document.getElementById('pauseResumeBtn').innerHTML = '⏸️ Pause';
                playNextInSequence();
            }
        }

        // Grid Pause / Resume Button
        function togglePauseResume() {
            if (!isPlaying) return;

            const pauseResumeBtn = document.getElementById('pauseResumeBtn');

            if (isPaused) {
                isPaused = false;
                pauseResumeBtn.innerHTML = '⏸️ Pause';
                playNextInSequence();
            } else {
                isPaused = true;
                if (playbackTimer) clearTimeout(playbackTimer);
                window.speechSynthesis.cancel();
                pauseResumeBtn.innerHTML = '▶️ Resume';
            }
        }

        function playNextInSequence() {
            if (!isPlaying || isPaused) return;

            if (playIndex >= flatCards.length) {
                if (isRepeatOn) {
                    playIndex = 0;
                } else {
                    stopPlayback();
                    return;
                }
            }

            const current = flatCards[playIndex];
            playIndex++;

            if (!current.word || current.word.trim() === '') {
                playNextInSequence();
            } else {
                speakForPlayAll(current.word, current.element, () => {
                    if (isPlaying && !isPaused) {
                        const isDelayed = document.getElementById('delayModeSelect').value === 'delayed';
                        const delayGap = isDelayed ? 1500 : 200;

                        playbackTimer = setTimeout(() => {
                            if (isPlaying && !isPaused) playNextInSequence();
                        }, delayGap);
                    }
                });
            }
        }

        function speakForPlayAll(text, cardElement, callback) {
            if (!text || text.trim() === '' || isEditMode) {
                if (callback) callback();
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 0.8;

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            currentUtterance = utterance;

            if (cardElement) {
                if (lastSpokenCard) lastSpokenCard.classList.remove('speaking');
                cardElement.classList.add('speaking');
                scrollToCardCenter(cardElement);
                lastSpokenCard = cardElement;
            }

            let executed = false;
            const done = () => {
                if (executed) return;
                executed = true;
                if (callback) callback();
            };

            const estimatedDuration = Math.max(500, (text.length * 350) / utterance.rate);
            const fallbackTimeout = setTimeout(done, estimatedDuration + 600);

            const safeDone = () => {
                clearTimeout(fallbackTimeout);
                done();
            };
            utterance.onend = safeDone;
            utterance.onerror = safeDone;

            window.speechSynthesis.speak(utterance);
        }

        function stopPlayback() {
            isPlaying = false;
            isPaused = false;
            if (playbackTimer) clearTimeout(playbackTimer);
            window.speechSynthesis.cancel();
            document.getElementById('playBtn').innerHTML = '▶️ Play All';
            const pauseResumeBtn = document.getElementById('pauseResumeBtn');
            if (pauseResumeBtn) {
                pauseResumeBtn.style.display = 'none';
                pauseResumeBtn.innerHTML = '⏸️ Pause';
            }
            if (lastSpokenCard) {
                lastSpokenCard.classList.remove('speaking');
                lastSpokenCard = null;
            }
            flatCards.forEach(c => {
                if (c.element) c.element.classList.remove('speaking');
            });
        }

        // --- Essay Reading Functions ---

        function handleEssayFocus(box) {
            if (essayState === 'STOPPED') {
                const range = document.createRange();
                range.selectNodeContents(box);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }
        }

        function toggleEssayRepeat() {
            essayRepeatOn = !essayRepeatOn;
            const btn = document.getElementById('essayRepeatBtn');
            if (essayRepeatOn) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function prepareEssaySentences() {
            const box = document.getElementById('essayBox');
            originalTextCache = box.innerText || box.textContent;
            
            if (!originalTextCache.trim()) return false;

            box.innerHTML = '';
            essaySentences = [];

            const lines = originalTextCache.split(/\r?\n/);

            lines.forEach((line, lineIndex) => {
                if (line.trim() === '') {
                    box.appendChild(document.createElement('br'));
                    return;
                }

                let parts = line.split(/(?<=[।?!.])/g).map(s => s.trim()).filter(s => s.length > 0);
                if (parts.length === 0) {
                    parts = [line];
                }

                parts.forEach((partText, partIndex) => {
                    const span = document.createElement('span');
                    span.className = 'essay-sentence';
                    span.textContent = partText + (partIndex < parts.length - 1 ? ' ' : '');
                    box.appendChild(span);
                    essaySentences.push({ element: span, text: partText });
                });

                if (lineIndex < lines.length - 1) {
                    box.appendChild(document.createElement('br'));
                }
            });

            return essaySentences.length > 0;
        }

        function toggleEssayPlayStop() {
            stopPlayback();

            const playStopBtn = document.getElementById('essayPlayStopBtn');

            if (essayState === 'PLAYING') {
                stopEssayPlayback();
            } else {
                if (!prepareEssaySentences()) return;

                essayState = 'PLAYING';
                essaySentenceIndex = 0;

                playStopBtn.innerHTML = '⏹️ Stop';

                playNextEssaySentence();
            }
        }

        function playNextEssaySentence() {
            if (essayState !== 'PLAYING') return;

            if (essaySentenceIndex >= essaySentences.length) {
                if (essayRepeatOn) {
                    essaySentenceIndex = 0;
                } else {
                    stopEssayPlayback();
                    return;
                }
            }

            const current = essaySentences[essaySentenceIndex];

            document.querySelectorAll('.essay-sentence.active-sentence').forEach(el => el.classList.remove('active-sentence'));
            current.element.classList.add('active-sentence');
            current.element.scrollIntoView({
                behavior: 'smooth',
                block: 'center',
                inline: 'nearest'
            });

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(current.text);
            utterance.lang = 'hi-IN';
            utterance.rate = parseFloat(document.getElementById('essaySpeedSelect').value) || 0.8;

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onend = () => {
                if (essayState === 'PLAYING') {
                    essaySentenceIndex++;
                    essayTimer = setTimeout(playNextEssaySentence, 200);
                }
            };

            utterance.onerror = () => {
                stopEssayPlayback();
            };

            window.speechSynthesis.speak(utterance);
        }

        function updateEssaySpeed() {
            if (essayState === 'PLAYING') {
                window.speechSynthesis.cancel();
                playNextEssaySentence();
            }
        }

        function stopEssayPlayback() {
            essayState = 'STOPPED';
            if (essayTimer) clearTimeout(essayTimer);
            window.speechSynthesis.cancel();

            document.querySelectorAll('.essay-sentence.active-sentence').forEach(el => el.classList.remove('active-sentence'));

            const box = document.getElementById('essayBox');
            if (originalTextCache) {
                box.innerText = originalTextCache;
            }

            const playStopBtn = document.getElementById('essayPlayStopBtn');
            if (playStopBtn) playStopBtn.innerHTML = '▶️ Play';
        }

        function stopAllPlayback() {
            stopPlayback();
            stopEssayPlayback();
        }

        function toggleEditMode() {
            stopAllPlayback();
            isEditMode = !isEditMode;
            const btn = document.getElementById('modeToggleBtn');
            const clearBtn = document.getElementById('clearAllBtn');
            
            if (isEditMode) {
                btn.innerHTML = '💾 Save & View';
                btn.classList.add('btn-active');
                clearBtn.style.display = 'inline-flex';
            } else {
                btn.innerHTML = '✏️ Edit Mode: OFF';
                btn.classList.remove('btn-active');
                clearBtn.style.display = 'none';
            }
            renderGrid();
        }

        function clearAllWords() {
            for (let r = 0; r < wordData.length; r++) {
                for (let c = 0; c < 6; c++) {
                    wordData[r][c] = '';
                }
            }
            saveWords();
            renderGrid();
        }

        function generateRandomWords() {
            stopAllPlayback();
            const selectedMatra = document.getElementById('matraSelect').value;
            const pool = wordDictionary[selectedMatra] || wordDictionary.no_matra;

            let shuffled = [...pool].sort(() => 0.5 - Math.random());

            let wordIndex = 0;
            for (let r = 0; r < wordData.length; r++) {
                for (let c = 0; c < 6; c++) {
                    wordData[r][c] = shuffled[wordIndex % shuffled.length];
                    wordIndex++;
                }
            }

            saveWords();
            renderGrid();
        }

        function addRow() {
            stopAllPlayback();
            wordData.push(["", "", "", "", "", ""]);
            saveWords();
            renderGrid();
        }

        function deleteLastRow() {
            stopAllPlayback();
            if (wordData.length <= 1) return;
            wordData.pop();
            saveWords();
            renderGrid();
        }

        function resetToDefault() {
            stopAllPlayback();
            wordData = JSON.parse(JSON.stringify(defaultWords));
            saveWords();
            renderGrid();
        }

        window.onload = () => {
            initSpeech();
            loadWords();
            renderGrid();
        };
    </script>
</body>
