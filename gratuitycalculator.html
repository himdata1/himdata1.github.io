<!DOCTYPE html>
<html>
<head>
    <title>Retirement Gratuity Calculator</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2255%22 font-size=%2270%22 fill=%22white%22 font-family=%22Verdana, sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>GC</text></svg>">

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2255%22 font-size=%2270%22 fill=%22white%22 font-family=%22Verdana, sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>GC</text></svg>">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- html2canvas library for screenshot generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            background-color: #f9f9f9;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            background-color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            font-size: 16px;
        }

        .form-group input[readonly] {
            background-color: white !important;
        }

        .form-group p {
            margin-top: 5px;
            font-size: 0.9em;
            color: #666;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-clear {
            background-color: #007BFF;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            width: 120px;
            margin-top: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 20px;
            outline: none;
        }

        .btn-clear:hover {
            background-color: #0056b3;
        }

        .btn-share {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s;
        }

        .btn-share:hover {
            background-color: #0056b3;
        }

        .btn-online {
            text-decoration: none; 
            display: inline-block; 
            text-align: center; 
            width: 320px; 
            background-color: #007BFF; 
            color: white; 
            padding: 10px; 
            border-radius: 20px; 
            margin-top: 10px;
        }

        .result {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .calculator-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="calculator-container" id="calculatorCard">
    <h2>Retirement Gratuity Calculator</h2>

    <div class="form-group">
        <label for="basicPayDA">1. Last Basic Pay + DA (in Rs.):</label>
        <input type="number" id="basicPayDA" name="basicPayDA" placeholder="Enter amount" oninput="checkInputs()">
    </div>

    <div class="form-group">
        <label for="joiningDate">2. Date of Joining:</label>
        <input type="date" id="joiningDate" name="joiningDate" onchange="checkInputs()">
    </div>

    <div class="form-group">
        <label for="retirementDate">3. Date of Retirement:</label>
        <input type="date" id="retirementDate" name="retirementDate" onchange="setLastDateOfMonth()" onkeydown="return false;">
    </div>

    <div id="result-boxes" class="hidden">
        <div class="form-group">
            <label for="durationService">4. Duration of Service:</label>
            <input type="text" id="durationService" name="durationService" readonly>
        </div>

        <div class="form-group">
            <label for="qualifyingService">5. Qualifying Service:</label>
            <input type="text" id="qualifyingService" name="qualifyingService" readonly>
        </div>

        <div class="form-group">
            <label for="gratuityAmount">6. Gratuity Amount (in Rs.):</label>
            <input type="text" id="gratuityAmount" name="gratuityAmount" readonly>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
            <button id="clearBtn" type="button" class="btn-clear" onclick="clearFields()">Clear</button>
            
            <button id="shareBtn" type="button" class="btn-share" onclick="shareScreenshot()" aria-label="Share">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>
        </div>

        <a id="onlineBtn" 
           href="https://pensionersportal.gov.in/PensionCalculators/RevisedPensionCalculator_2016/GratuityCalculator_7pc.aspx" 
           target="_blank" 
           class="btn-online" 
           style="width: 100%; box-sizing: border-box;">
            Click here to calculate online
        </a>
    </div>
</div>

<script>
    document.getElementById('retirementDate').addEventListener('focus', function() {
        if (!this.value) {
            const now = new Date();
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            const year = lastDay.getFullYear();
            const month = String(lastDay.getMonth() + 1).padStart(2, '0');
            const day = String(lastDay.getDate()).padStart(2, '0');
            this.value = `${year}-${month}-${day}`;
            setLastDateOfMonth();
        }
    });

    function setLastDateOfMonth() {
        const retirementDateInput = document.getElementById('retirementDate');
        if (retirementDateInput.value) {
            const selectedDate = new Date(retirementDateInput.value);
            const lastDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1, 0).getDate();
            
            selectedDate.setDate(lastDay);
            retirementDateInput.value = selectedDate.toISOString().split('T')[0];
        }
        checkInputs();
    }

    function checkInputs() {
        const basicPayDA = document.getElementById('basicPayDA').value;
        const joiningDateInput = document.getElementById('joiningDate').value;
        const retirementDateInput = document.getElementById('retirementDate').value;
        const resultBoxes = document.getElementById('result-boxes');

        if (basicPayDA && joiningDateInput && retirementDateInput) {
            const joiningDate = new Date(joiningDateInput);
            const retirementDate = new Date(retirementDateInput);

            if (retirementDate < joiningDate) {
                alert("Date of Retirement cannot be before the Date of Joining.");
                document.getElementById('retirementDate').value = '';
                resultBoxes.classList.add('hidden');
                return;
            }

            resultBoxes.classList.remove('hidden');
            calculateGratuity();
        } else {
            resultBoxes.classList.add('hidden');
        }
    }

    function calculateGratuity() {
        const basicPayDA = parseFloat(document.getElementById('basicPayDA').value);
        const joiningDateInput = document.getElementById('joiningDate').value;
        const retirementDateInput = document.getElementById('retirementDate').value;

        if (!joiningDateInput || !retirementDateInput || isNaN(basicPayDA)) {
            clearFields();
            return;
        }

        const joiningDate = new Date(joiningDateInput);
        const retirementDate = new Date(retirementDateInput);
        
        let years = 0;
        let months = 0;
        let days = 0;

        if (joiningDate.getDate() === 1) {
            years = retirementDate.getFullYear() - joiningDate.getFullYear();
            months = retirementDate.getMonth() - joiningDate.getMonth();
            days = retirementDate.getDate() - joiningDate.getDate();

            if (days < 0) {
                months--;
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const lastDayOfRetirementMonth = new Date(retirementDate.getFullYear(), retirementDate.getMonth() + 1, 0).getDate();
            if (retirementDate.getDate() === lastDayOfRetirementMonth) {
                months++;
            }

            if (months >= 12) {
                years++;
                months -= 12;
            }

            days = 0;
        } else {
            const lastDayOfJoiningMonth = new Date(joiningDate.getFullYear(), joiningDate.getMonth() + 1, 0).getDate();
            const daysInFirstMonthPeriod = lastDayOfJoiningMonth - joiningDate.getDate() + 1;

            if (retirementDate.getFullYear() === joiningDate.getFullYear() && retirementDate.getMonth() === joiningDate.getMonth()) {
                days = retirementDate.getDate() - joiningDate.getDate() + 1;
            } else {
                days = daysInFirstMonthPeriod;

                const nextMonthStart = new Date(joiningDate.getFullYear(), joiningDate.getMonth() + 1, 1);
                let tempDate = nextMonthStart;

                while (tempDate <= retirementDate) {
                    months++;
                    tempDate.setMonth(tempDate.getMonth() + 1);
                }
            }

            years = Math.floor(months / 12);
            months = months % 12;
        }

        const yearText = years === 1 ? 'year' : 'years';
        const monthText = months === 1 ? 'month' : 'months';
        const dayText = days === 1 ? 'day' : 'days';

        document.getElementById('durationService').value = `${years} ${yearText}, ${months} ${monthText}, ${days} ${dayText}`;

        let qualifyingYears = years;
        let qualifyingMonths = months;

        let halfYearIncrement = 0;
        if (qualifyingMonths > 2 && qualifyingMonths <= 8) {
            halfYearIncrement = 0.5;
        } else if (qualifyingMonths > 8) {
            halfYearIncrement = 1;
        }

        const qualifyingServiceRaw = qualifyingYears + halfYearIncrement;
        const qualifyingServiceHalfYears = Math.min(66, Math.floor(qualifyingServiceRaw * 2));

        document.getElementById('qualifyingService').value = `${qualifyingServiceHalfYears} half years`;

        const maxGratuity = 2000000;
        const gratuityCalculation = (qualifyingServiceHalfYears / 2) * (basicPayDA / 2);
        const finalGratuity = Math.min(maxGratuity, gratuityCalculation);

        document.getElementById('gratuityAmount').value = Math.round(finalGratuity);
    }

    function clearFields() {
        document.getElementById('basicPayDA').value = '';
        document.getElementById('joiningDate').value = '';
        document.getElementById('retirementDate').value = ''; 
        document.getElementById('durationService').value = '';
        document.getElementById('qualifyingService').value = '';
        document.getElementById('gratuityAmount').value = '';
        document.getElementById('result-boxes').classList.add('hidden');
    }

    // SCREENSHOT SHARE (DD/MM/YYYY FORMAT, NO TEXT, NO BUTTONS)
    async function shareScreenshot() {
        const amount = document.getElementById('gratuityAmount').value;

        if (!amount) {
            alert("Pehle sabhi details bhar kar calculation karein!");
            return;
        }

        const clearBtn = document.getElementById('clearBtn');
        const shareBtn = document.getElementById('shareBtn');
        const onlineBtn = document.getElementById('onlineBtn');

        const joiningDateInput = document.getElementById('joiningDate');
        const retirementDateInput = document.getElementById('retirementDate');

        // Store original values (YYYY-MM-DD)
        const originalJoiningVal = joiningDateInput.value;
        const originalRetirementVal = retirementDateInput.value;

        // Convert YYYY-MM-DD to DD/MM/YYYY
        const formatDateToDDMMYYYY = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
        };

        // Hide buttons from screenshot
        if (clearBtn) clearBtn.style.visibility = 'hidden';
        if (shareBtn) shareBtn.style.visibility = 'hidden';
        if (onlineBtn) onlineBtn.style.visibility = 'hidden';

        // Temporarily change inputs to text type with DD/MM/YYYY format for screenshot
        if (originalJoiningVal) {
            joiningDateInput.type = 'text';
            joiningDateInput.value = formatDateToDDMMYYYY(originalJoiningVal);
        }
        if (originalRetirementVal) {
            retirementDateInput.type = 'text';
            retirementDateInput.value = formatDateToDDMMYYYY(originalRetirementVal);
        }

        const restoreUI = () => {
            if (clearBtn) clearBtn.style.visibility = 'visible';
            if (shareBtn) shareBtn.style.visibility = 'visible';
            if (onlineBtn) onlineBtn.style.visibility = 'visible';

            // Restore inputs back to date picker type and original values
            joiningDateInput.type = 'date';
            joiningDateInput.value = originalJoiningVal;

            retirementDateInput.type = 'date';
            retirementDateInput.value = originalRetirementVal;
        };

        try {
            if (typeof html2canvas !== 'undefined') {
                const container = document.getElementById('calculatorCard');
                const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
                
                restoreUI();

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'Gratuity_Calculation.png', { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file]
                            });
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.log("Share cancelled or failed", err);
                            }
                        }
                    } else if (typeof Android !== 'undefined' && typeof Android.share === 'function') {
                        Android.share();
                    } else {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = 'Gratuity_Calculation.png';
                        link.click();
                    }
                }, 'image/png');
            } else {
                restoreUI();
                alert("Screenshot tool load nahi ho saka.");
            }
        } catch (err) {
            restoreUI();
            console.log(err);
        }
    }
</script>

</body>
</html>
