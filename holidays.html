<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Government Holidays</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2255%22 font-size=%2275%22 fill=%22white%22 font-family=%22Verdana, sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>H</text></svg>">

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23007bff%22/><text x=%2250%22 y=%2255%22 font-size=%2275%22 fill=%22white%22 font-family=%22Verdana, sans-serif%22 font-weight=%22900%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>H</text></svg>">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 10px;
    background-color: #f9f9f9;
}

.download-container {
    text-align: center;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.year-select {
    padding: 11px 16px;
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #007bff;
    border-radius: 5px;
    background-color: #fff;
    color: #000;
    cursor: pointer;
}

.btn-download {
    background-color: #27ae60;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.btn-print {
    background-color: #007bff;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

#content-to-print {
    background: #fff;
    padding: 12px;
    max-width: 1000px;
    margin: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

th, td {
    border: 0.5px solid black;
    padding: 9px;
    vertical-align: top;
}

th {
    background: #eaf4ff;
    color: #000;
    text-transform: uppercase;
    font-size: 16px;
}

.date-col {
    width: 12%;
    font-weight: bold;
    color: #000;
}

.note {
    margin-top: 10px;
    font-size: 13px;
    background: #fff3cd;
    padding: 10px;
    border: 1px solid #ffeeba;
}

.star {
    color: red;
    font-weight: bold;
}

@media print {
    body { margin: 0; background: #fff; }
    .download-container { display: none; }
    
    #content-to-print { 
        max-width: 100%; 
        margin: 0; 
        padding: 10px; 
    }

    th {
        background-color: #ffffff !important;
        color: #000000 !important;
        -webkit-print-color-adjust: exact;
    }

    table { 
        font-size: 14px; 
        line-height: 1.14; /* ~5% reduction from default ~1.2 */
        border-collapse: collapse;
        width: 100%;
    }

    table, th, td {
        border: 0.1pt solid #888888 !important;
    }

    th, td {
        padding: 8.55px !important; /* ~5% reduction from 9px */
        line-height: 1.14 !important;
    }

    @page { 
        size: A4; 
        margin: 10mm 15mm 1mm 15mm; 
    }
}
</style>

</head>

<body>

<div class="download-container">
    <select id="year-select" class="year-select" aria-label="Select Year" onchange="renderHolidays()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
    </select>
    <button class="btn-print" onclick="window.print()">
        Print/ Save as PDF
    </button>
    <button class="btn-download" onclick="downloadVectorPDF()">
        Download PDF
    </button>
</div>

<div id="content-to-print">
    <h2 id="pdf-title" style="text-align:center; margin-top:0;">
        Himachal Pradesh Government Holidays - 2026
    </h2>

    <table id="holidays-table">
        <thead>
            <tr>
                <th class="date-col">Date</th>
                <th>Gazetted Holidays</th>
                <th class="date-col">Date</th>
                <th>Restricted Holidays</th>
            </tr>
        </thead>
        <tbody id="holidays-tbody"></tbody>
    </table>

    <div id="pdf-note" class="note"></div>
</div>

<script>
const holidayData = {
    2026: {
        title: "Himachal Pradesh Government Holidays - 2026",
        fileName: "HP Holidays 2026.pdf",
        noteHtml: "<strong>Note:</strong> * Raksha Bandhan, Karwa Chauth and Bhai Duj are declared as Gazetted Holidays for women employees of the State Government.",
        rows: [
            { gDate: "25 Jan", gName: "Statehood Day", rDate: "01 Jan", rName: "New Year's Day" },
            { gDate: "26 Jan", gName: "Republic Day", rDate: "14 Jan", rName: "Makar Sankranti" },
            { gDate: "", gName: "", rDate: "23 Jan", rName: "Basant Panchami" },
            { gDate: "01 Feb", gName: "Guru Ravidas Jayanti", rDate: "12 Feb", rName: "Swami Dayanand Saraswati Jayanti" },
            { gDate: "15 Feb", gName: "Maha Shivratri", rDate: "", rName: "" },
            { gDate: "04 Mar", gName: "Holi", rDate: "31 Mar", rName: "Mahavir Jayanti" },
            { gDate: "21 Mar", gName: "Id-ul-Fitr", rDate: "", rName: "" },
            { gDate: "26 Mar", gName: "Ram Navami", rDate: "", rName: "" },
            { gDate: "03 Apr", gName: "Good Friday", rDate: "05 Apr", rName: "Easter Sunday" },
            { gDate: "14 Apr", gName: "Dr. B.R. Ambedkar's Birthday", rDate: "", rName: "" },
            { gDate: "15 Apr", gName: "Himachal Day", rDate: "", rName: "" },
            { gDate: "19 Apr", gName: "Parshu Ram Jayanti", rDate: "", rName: "" },
            { gDate: "01 May", gName: "Budha Purnima", rDate: "09 May", rName: "Guru Rabindranath Tagore Jayanti" },
            { gDate: "27 May", gName: "Id-ul-Zuha", rDate: "", rName: "" },
            { gDate: "17 Jun", gName: "Maharana Pratap Jayanti", rDate: "", rName: "" },
            { gDate: "26 Jun", gName: "Muharram", rDate: "", rName: "" },
            { gDate: "29 Jun", gName: "Sant Guru Kabir Jayanti", rDate: "", rName: "" },
            { gDate: "15 Aug", gName: "Independence Day", rDate: "28 Aug", rName: "*Raksha Bandhan" },
            { gDate: "04 Sep", gName: "Janmashtami", rDate: "14 Sep", rName: "Ganesh Chaturthi" },
            { gDate: "02 Oct", gName: "Gandhi Jayanti", rDate: "19 Oct", rName: "Maha Ashtami" },
            { gDate: "20 Oct", gName: "Dussehra", rDate: "29 Oct", rName: "*Karva Chauth" },
            { gDate: "26 Oct", gName: "Valmiki Jayanti", rDate: "", rName: "" },
            { gDate: "08 Nov", gName: "Diwali", rDate: "09 Nov", rName: "Goverdhan Puja" },
            { gDate: "24 Nov", gName: "Guru Nanak Jayanti", rDate: "11 Nov", rName: "*Bhai Duj" },
            { gDate: "", gName: "", rDate: "24 Nov", rName: "Guru Teg Bahadur's Martyrdom Day" },
            { gDate: "25 Dec", gName: "Christmas Day", rDate: "24 Dec", rName: "Christmas Eve" }
        ]
    },
    2027: {
        title: "Himachal Pradesh Government Holidays - 2027",
        fileName: "HP Holidays 2027.pdf",
        noteHtml: "<strong>Note:</strong> * Karva Chauth and Bhai Duj (Annexure-II) are declared as Gazetted Holidays for women employees of the State Government. (Raksha Bandhan is included in the main Gazetted Holidays list for 2027).",
        rows: [
            { gDate: "25 Jan", gName: "Statehood Day", rDate: "01 Jan", rName: "New Year's Day" },
            { gDate: "26 Jan", gName: "Republic Day", rDate: "14 Jan", rName: "Makar Sankranti" },
            { gDate: "20 Feb", gName: "Guru Ravi Das's Birthday", rDate: "11 Feb", rName: "Sri Panchami, Basant Panchami" },
            { gDate: "06 Mar", gName: "Maha Shivratri", rDate: "02 Mar", rName: "Birthday of Swami Dayananda Saraswati" },
            { gDate: "10 Mar", gName: "Id-ul-Fitr", rDate: "", rName: "" },
            { gDate: "23 Mar", gName: "Holi", rDate: "", rName: "" },
            { gDate: "26 Mar", gName: "Good Friday", rDate: "28 Mar", rName: "Easter Sunday" },
            { gDate: "14 Apr", gName: "Dr. B. R. Ambedkar's Birthday", rDate: "", rName: "" },
            { gDate: "15 Apr", gName: "Himachal Day / Ram Navami", rDate: "19 Apr", rName: "Mahavir Jayanti" },
            { gDate: "08 May", gName: "Bhagvan Shree Parshuram Jayanti", rDate: "09 May", rName: "Guru Rabindranath Tagore's Birthday" },
            { gDate: "17 May", gName: "Id-ul-Zuha (Bakrid)", rDate: "", rName: "" },
            { gDate: "20 May", gName: "Budha Purnima", rDate: "", rName: "" },
            { gDate: "07 Jun", gName: "Maharana Pratap Jayanti", rDate: "", rName: "" },
            { gDate: "16 Jun", gName: "Muharram", rDate: "", rName: "" },
            { gDate: "18 Jun", gName: "Sant Guru Kabir Jayanti (Prakat Diwas)", rDate: "", rName: "" },
            { gDate: "15 Aug", gName: "Independence Day", rDate: "", rName: "" },
            { gDate: "17 Aug", gName: "Raksha Bandhan", rDate: "", rName: "" },
            { gDate: "25 Aug", gName: "Janmashtami (Vaishnav)", rDate: "04 Sep", rName: "Ganesh Chaturthi / Vinayaka Chaturthi" },
            { gDate: "02 Oct", gName: "Mahatma Gandhi's Birthday", rDate: "07 Oct", rName: "Dussehra (Mahashtami)" },
            { gDate: "09 Oct", gName: "Dussehra (Vijaya Dashmi)", rDate: "18 Oct", rName: "*Karva Chauth" },
            { gDate: "15 Oct", gName: "Maharishi Valmiki's Birthday", rDate: "", rName: "" },
            { gDate: "29 Oct", gName: "Diwali (Deepavali)", rDate: "30 Oct", rName: "Govardhan Puja" },
            { gDate: "", gName: "", rDate: "31 Oct", rName: "*Bhai Duj" },
            { gDate: "14 Nov", gName: "Guru Nanak's Birthday", rDate: "24 Nov", rName: "Guru Teg Bahadur's Martyrdom Day" },
            { gDate: "25 Dec", gName: "Christmas Day", rDate: "24 Dec", rName: "Christmas Eve" }
        ]
    }
};

function formatHolidayCell(text) {
    if (!text) return "";
    if (text.startsWith("*")) {
        return `<span class="star">*</span>${text.slice(1)}`;
    }
    return text;
}

function setDefaultCurrentYear() {
    const select = document.getElementById("year-select");
    const currentYear = String(new Date().getFullYear());
    const availableYears = Object.keys(holidayData);

    if (holidayData[currentYear]) {
        select.value = currentYear;
    } else if (availableYears.length > 0) {
        select.value = availableYears[availableYears.length - 1];
    }
}

function renderHolidays() {
    const year = document.getElementById("year-select").value;
    const data = holidayData[year];
    if (!data) return;

    document.title = `HP Government Holidays ${year}`;
    document.getElementById("pdf-title").textContent = data.title;
    document.getElementById("pdf-note").innerHTML = data.noteHtml;

    const tbody = document.getElementById("holidays-tbody");
    tbody.innerHTML = data.rows.map(row => `
        <tr>
            <td class="date-col">${row.gDate}</td>
            <td>${formatHolidayCell(row.gName)}</td>
            <td class="date-col">${row.rDate}</td>
            <td>${formatHolidayCell(row.rName)}</td>
        </tr>
    `).join("");
}

function downloadVectorPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    const year = document.getElementById("year-select").value;
    const data = holidayData[year];
    const title = document.getElementById('pdf-title').innerText;
    const noteText = document.getElementById('pdf-note').innerText;

    doc.setFont("helvetica", "bold"); 
    doc.setFontSize(16);
    doc.text(title, 105, 15, { align: 'center' });

    doc.autoTable({
        html: '#holidays-table',
        startY: 22,
        margin: { left: 6, right: 6 },
        theme: 'grid',
        styles: { 
            fontSize: 13.5,
            lineHeight: 1.09, // ~5% reduction from default ~1.15
            cellPadding: [1.71, 1, 1.71, 2.5], // ~5% reduction from 1.8
            lineColor: [0, 0, 0],
            lineWidth: 0.1,
            textColor: [0, 0, 0]
        },
        headStyles: { 
            fillColor: [255, 255, 255], 
            textColor: [0, 0, 0], 
            fontStyle: 'bold',
            fontSize: 14,
            lineHeight: 1.09
        },
        columnStyles: {
            0: { fontStyle: 'bold', cellWidth: 20 },
            2: { fontStyle: 'bold', cellWidth: 20 }
        },
        didParseCell: function(data) {
            if (data.section === 'body' && data.cell.text && data.cell.text[0].includes('*')) {
                data.cell.text[0] = data.cell.text[0].replace('*', '  ');
            }
        },
        didDrawCell: function(data) {
            if (data.section === 'body' && (data.column.index === 1 || data.column.index === 3)) {
                const originalText = data.cell.raw.innerText || data.cell.raw.textContent;
                if (originalText && originalText.includes('*')) {
                    doc.setFontSize(10);
                    doc.setTextColor(255, 0, 0);
                    doc.setFont("helvetica", "bold");
                    doc.text('*', data.cell.x + 2.5, data.cell.y + 5.2);
                    doc.setTextColor(0, 0, 0);
                }
            }
        }
    });

    const finalY = doc.lastAutoTable.finalY;
    const margin = 12;
    const maxWidth = 186;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    
    const wrappedNote = doc.splitTextToSize(noteText, maxWidth);
    doc.text(wrappedNote, margin, finalY + 10.5, { lineHeightFactor: 1.1 });

    doc.save(data ? data.fileName : `HP Holidays ${year}.pdf`);
}

setDefaultCurrentYear();
renderHolidays();
</script>

</body>
</html>
