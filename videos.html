<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Playlist Player</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: black;
            display: block;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }
        select {
            background: #2d2d2d;
            color: white;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="player-container">
    <video id="videoPlayer" controls playsinline></video>

    <div class="controls">
        <div>
            Playing: <span id="videoName" class="highlight">Loading...</span>
        </div>
        <select id="loopMode">
            <option value="repeat-all" selected>Repeat All</option>
            <option value="repeat-one">Repeat One</option>
            <option value="none">None</option>
        </select>
    </div>
</div>

<script>
    // LIST YOUR FILES HERE. 
    // Simply add more lines like the ones below to add more videos.
    const playlist = [
        "https://himdata1.github.io/a.mp4",
        "https://himdata1.github.io/b.mp4",
        "https://himdata1.github.io/c.mp4"
        // "https://himdata1.github.io/d.mp4", 
        // "https://himdata1.github.io/e.mp4"
    ];

    let currentIndex = 0;
    let started = false;

    const player = document.getElementById("videoPlayer");
    const videoName = document.getElementById("videoName");
    const loopMode = document.getElementById("loopMode");

    function loadVideo(index) {
        if (index >= playlist.length) index = 0;
        currentIndex = index;

        player.src = playlist[currentIndex];
        videoName.textContent = playlist[currentIndex].split("/").pop();
        player.load();

        if (started) {
            player.play().catch(e => console.log("Playback blocked:", e));
        }
    }

    // This handles errors (like if a file doesn't exist) so the player doesn't stop
    player.onerror = () => {
        console.warn("Video failed to load, skipping:", playlist[currentIndex]);
        setTimeout(() => {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadVideo(currentIndex);
        }, 1000);
    };

    player.addEventListener("play", () => { started = true; });

    player.addEventListener("ended", () => {
        const mode = loopMode.value;

        if (mode === "repeat-one") {
            player.currentTime = 0;
            player.play();
        } else if (mode === "repeat-all") {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadVideo(currentIndex);
        } else {
            // Mode: None
            if (currentIndex < playlist.length - 1) {
                loadVideo(currentIndex + 1);
            } else {
                videoName.textContent = "Playlist Finished";
            }
        }
    });

    // Start
    if (playlist.length > 0) {
        loadVideo(0);
    } else {
        videoName.textContent = "No videos in playlist";
    }
</script>

</body>
</html>
