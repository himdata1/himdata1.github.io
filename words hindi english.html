<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Learning Grid - शब्द सीखें</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007bff'/><text x='50' y='52' font-size='68' fill='white' font-family='Verdana, sans-serif' font-weight='900' text-anchor='middle' dominant-baseline='central'>W</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007bff'/><text x='50' y='52' font-size='68' fill='white' font-family='Verdana, sans-serif' font-weight='900' text-anchor='middle' dominant-baseline='central'>W</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f0f4f0;
            min-height: 100vh;
            padding: 20px 10px 60px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 5px;
            text-align: center;
            font-size: 22px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }

        .controls {
            background-color: #ffffff;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            max-width: 980px;
            width: 100%;
            position: sticky;
            top: 5px;
            z-index: 100;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-primary {
            background-color: #2e7d32;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1b5e20;
        }

        .btn-lang-toggle {
            background-color: #2e7d32;
            color: white;
            border: 1.5px solid #1b5e20;
        }

        .btn-lang-toggle:hover {
            background-color: #1b5e20;
        }

        .btn-play {
            background-color: #0288d1;
            color: white;
        }

        .btn-play:hover {
            background-color: #01579b;
        }

        .btn-pause {
            background-color: #7b1fa2;
            color: white;
        }

        .btn-pause:hover {
            background-color: #4a148c;
        }

        .btn-repeat {
            background-color: #e0e0e0;
            color: #757575;
            border: 1px solid #ccc;
        }

        .btn-repeat.active {
            background-color: #4caf50 !important;
            color: white !important;
            border: 1px solid #388e3c;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d5d5d5;
        }

        .btn-danger {
            background-color: #d32f2f;
            color: white;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .btn-random {
            background-color: #ff9800;
            color: white;
        }

        .btn-random:hover {
            background-color: #e68a00;
        }

        .btn-rhyme {
            background-color: #8e24aa;
            color: white;
        }

        .btn-rhyme:hover {
            background-color: #6a1b9a;
        }

        .btn-rhyme:disabled {
            background-color: #e0e0e0 !important;
            color: #9e9e9e !important;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        .btn-active {
            outline: 3px solid #ff9800;
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #333;
        }

        .setting-group select {
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
            outline: none;
        }

        /* Grid Layout */
        .grid-container {
            width: 100%;
            max-width: 800px;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            border-bottom: 1px solid #222;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row:nth-child(odd) {
            background-color: #72db35;
        }

        .row:nth-child(even) {
            background-color: #c0e89b;
        }

        .card {
            border-right: 1px solid #222;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: transform 0.1s ease, filter 0.2s, background-color 0.2s ease;
            scroll-margin-top: 180px;
        }

        .card:last-child {
            border-right: none;
        }

        .row:nth-child(4n+1) .card,
        .row:nth-child(4n+3) .card {
            color: #0d0d0d;
        }

        .row:nth-child(4n+2) .card,
        .row:nth-child(4n+4) .card {
            color: #e50000;
        }

        .card:hover {
            filter: brightness(0.92);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.speaking {
            background-color: #fff9c4 !important;
            color: #000000 !important;
            animation: pulse 0.6s infinite alternate;
            outline: 4px solid #fbc02d;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .card-input-wrapper {
            position: relative;
            width: 90%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-input {
            width: 100%;
            height: 100%;
            border: 2px dashed #000;
            background: rgba(255, 255, 255, 0.95);
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            outline: none;
            padding-right: 18px;
            text-transform: lowercase;
        }

        .delete-card-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ff1744;
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .card {
                height: 52px;
                font-size: 18px;
                scroll-margin-top: 260px;
            }
            .controls {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <h1 id="appTitle">हिंदी शब्द उच्चारण अभ्यास</h1>
    <p id="appSubtitle" class="subtitle">किसी भी शब्द पर क्लिक करके उच्चारण सुनें</p>

    <div class="controls">

        <button id="playBtn" class="btn btn-play" onclick="togglePlayAll()">
            ▶️ Play All
        </button>

        <button id="pauseBtn" class="btn btn-pause" onclick="togglePauseResume()">
            ⏸️ Pause
        </button>

        <button id="repeatBtn" class="btn btn-repeat" onclick="toggleRepeat()">
            🔁 Repeat
        </button>

        <div class="setting-group">
            <label for="delayModeSelect">Mode:</label>
            <select id="delayModeSelect">
                <option value="normal" selected>Normal</option>
                <option value="delayed">Delayed (1.5s)</option>
            </select>
        </div>

        <!-- Hindi Matra Filter -->
        <div class="setting-group" id="matraGroup">
            <select id="matraSelect">
                <option value="no_matra">बिना मात्रा</option>
                <option value="aa_matra">आ (ा)</option>
                <option value="i_matra">इ (ि)</option>
                <option value="ee_matra">ई (ी)</option>
                <option value="u_matra">उ (ु)</option>
                <option value="oo_matra">ऊ (ू)</option>
                <option value="ri_matra">ऋ (ृ)</option>
                <option value="e_matra">ए (े)</option>
                <option value="ai_matra">ऐ (ै)</option>
                <option value="o_matra">ओ (ो)</option>
                <option value="au_matra">औ (ौ)</option>
                <option value="am_matra">अं (ं)</option>
                <option value="ah_matra">अः (ः)</option>
            </select>
        </div>

        <!-- English Alphabets Count Filter -->
        <div class="setting-group" id="alphabetGroup" style="display: none;">
            <select id="alphabetSelect" onchange="checkRhymeButtonState()">
                <option value="2" selected>2 Alphabets</option>
                <option value="3">3 Alphabets</option>
                <option value="4">4 Alphabets</option>
                <option value="5">5 Alphabets</option>
                <option value="6">6 Alphabets</option>
            </select>
        </div>

        <!-- English Same Sound / Rhyme Button -->
        <button id="rhymeBtn" class="btn btn-rhyme" style="display: none;" disabled onclick="generateRhymingWords()">
            🎵 Same Sound
        </button>

        <button class="btn btn-random" onclick="generateRandomWords()">
            🎲 Random
        </button>

        <button id="clearAllBtn" class="btn btn-danger" style="display:none;" onclick="clearAllWords()">
            🧹 Clear All
        </button>

        <button class="btn btn-secondary" onclick="addRow()">
            ➕ Row
        </button>

        <button class="btn btn-danger" onclick="deleteLastRow()">
            🗑️ Del Row
        </button>

        <button class="btn btn-secondary" onclick="resetToDefault()">
            🔄 Reset
        </button>

        <div class="setting-group">
            <label for="speedSelect">Speed:</label>
            <select id="speedSelect">
                <option value="0.6">Slow</option>
                <option value="0.8" selected>Normal</option>
                <option value="1.0">Fast</option>
            </select>
        </div>
    </div>

    <div id="gridContainer" class="grid-container"></div>

        function initSpeech() {
            if ('speechSynthesis' in window) {
                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    selectedVoiceHindi = voices.find(v => v.lang.includes('hi') || v.lang.includes('HI')) || null;
                    selectedVoiceEnglish = voices.find(v => v.lang.includes('en-GB') || v.lang.includes('en-US') || v.lang.includes('en')) || null;
                };
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;

        function checkRhymeButtonState() {
            const alphabetSelect = document.getElementById('alphabetSelect');
            const rhymeBtn = document.getElementById('rhymeBtn');
            if (currentLang === 'en' && alphabetSelect.value === '3') {
                rhymeBtn.removeAttribute('disabled');
            } else {
                rhymeBtn.setAttribute('disabled', 'true');
            }
        }

        function toggleLanguage() {
            stopPlayback();
            // Toggle language between 'hi' and 'en'
            currentLang = (currentLang === 'hi') ? 'en' : 'hi';
            updateLanguageUI();
            loadWords();
            renderGrid();
        }

        function updateLanguageUI() {
            const langBtn = document.getElementById('langToggleBtn');
            const matraGroup = document.getElementById('matraGroup');
            const alphabetGroup = document.getElementById('alphabetGroup');
            const rhymeBtn = document.getElementById('rhymeBtn');
            const appTitle = document.getElementById('appTitle');
            const appSubtitle = document.getElementById('appSubtitle');

            if (currentLang === 'hi') {
                langBtn.innerHTML = '🌐 Lang: हिंदी (HI)';
                matraGroup.style.display = 'flex';
                alphabetGroup.style.display = 'none';
                rhymeBtn.style.display = 'none';
                appTitle.innerText = "हिंदी शब्द उच्चारण अभ्यास";
                appSubtitle.innerText = "किसी भी शब्द पर क्लिक करके उच्चारण सुनें";
            } else {
                langBtn.innerHTML = '🌐 Lang: English (EN)';
                matraGroup.style.display = 'none';
                alphabetGroup.style.display = 'flex';
                rhymeBtn.style.display = 'inline-flex';
                checkRhymeButtonState();
                appTitle.innerText = "English Word Pronunciation Practice";
                appSubtitle.innerText = "Click on any word to listen to its pronunciation";
            }
        }

        function loadWords() {
            const storageKey = 'grid_words_' + currentLang;
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                try {
                    wordData = JSON.parse(saved);
                } catch (e) {
                    wordData = JSON.parse(JSON.stringify(currentLang === 'hi' ? defaultWordsHindi : defaultWordsEnglish));
                }
            } else {
                wordData = JSON.parse(JSON.stringify(currentLang === 'hi' ? defaultWordsHindi : defaultWordsEnglish));
            }
        }

        function saveWords() {
            const storageKey = 'grid_words_' + currentLang;
            localStorage.setItem(storageKey, JSON.stringify(wordData));
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            flatCards = [];

            wordData.forEach((row, rowIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                row.forEach((word, colIndex) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';

                    const displayWord = (currentLang === 'en' && typeof word === 'string') ? word.toLowerCase() : word;

                    if (isEditMode) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'card-input-wrapper';

                        const inputEl = document.createElement('input');
                        inputEl.type = 'text';
                        inputEl.className = 'card-input';
                        inputEl.value = displayWord;
                        
                        inputEl.onfocus = () => inputEl.select();
                        
                        inputEl.oninput = (e) => {
                            let val = e.target.value;
                            if (currentLang === 'en') val = val.toLowerCase();
                            wordData[rowIndex][colIndex] = val;
                            saveWords();
                        };

                        const delBtn = document.createElement('button');
                        delBtn.className = 'delete-card-btn';
                        delBtn.innerHTML = '✕';
                        delBtn.title = 'Clear word';
                        delBtn.onclick = (e) => {
                            e.stopPropagation();
                            wordData[rowIndex][colIndex] = '';
                            saveWords();
                            renderGrid();
                        };

                        wrapper.appendChild(inputEl);
                        wrapper.appendChild(delBtn);
                        cardEl.appendChild(wrapper);
                    } else {
                        cardEl.textContent = displayWord;
                        cardEl.onclick = () => {
                            stopPlayback();
                            speakSingleWord(displayWord, cardEl);
                        };
                    }

                    rowEl.appendChild(cardEl);
                    flatCards.push({ element: cardEl, word: displayWord });
                });

                container.appendChild(rowEl);
            });
        }

        function scrollToCardCenter(element) {
            if (!element) return;
            element.scrollIntoView({
                behavior: 'smooth',
                block: 'center',
                inline: 'nearest'
            });
        }

        function speakSingleWord(text, cardElement) {
            if (!text || text.trim() === '' || isEditMode) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'hi' ? 'hi-IN' : 'en-US';
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 0.8;

            const voice = currentLang === 'hi' ? selectedVoiceHindi : selectedVoiceEnglish;
            if (voice) {
                utterance.voice = voice;
            }

            currentUtterance = utterance;

            if (cardElement) {
                if (lastSpokenCard) lastSpokenCard.classList.remove('speaking');
                cardElement.classList.add('speaking');
                scrollToCardCenter(cardElement);
                lastSpokenCard = cardElement;
            }

            utterance.onend = () => {
                if (!isPlaying && cardElement) {
                    cardElement.classList.remove('speaking');
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function toggleRepeat() {
            isRepeatOn = !isRepeatOn;
            const repeatBtn = document.getElementById('repeatBtn');
            if (isRepeatOn) {
                repeatBtn.classList.add('active');
            } else {
                repeatBtn.classList.remove('active');
            }
        }

        function togglePlayAll() {
            if (isEditMode) return;
            
            if (isPlaying || isPaused) {
                stopPlayback();
            } else {
                if (flatCards.length === 0) return;
                isPlaying = true;
                isPaused = false;
                playIndex = 0;
                document.getElementById('playBtn').innerHTML = '⏹️ Stop All';
                document.getElementById('pauseBtn').innerHTML = '⏸️ Pause';
                playNextInSequence();
            }
        }

        function togglePauseResume() {
            if (isEditMode) return;
            const pauseBtn = document.getElementById('pauseBtn');

            if (isPlaying && !isPaused) {
                isPlaying = false;
                isPaused = true;
                if (playbackTimer) clearTimeout(playbackTimer);
                window.speechSynthesis.cancel();
                pauseBtn.innerHTML = '▶️ Resume';
            } else if (!isPlaying && isPaused) {
                isPlaying = true;
                isPaused = false;
                pauseBtn.innerHTML = '⏸️ Pause';
                if (playIndex > 0) playIndex--;
                playNextInSequence();
            }
        }

        function playNextInSequence() {
            if (!isPlaying) return;

            if (playIndex >= flatCards.length) {
                if (isRepeatOn) {
                    playIndex = 0;
                } else {
                    stopPlayback();
                    return;
                }
            }

            const current = flatCards[playIndex];
            playIndex++;

            if (!current.word || current.word.trim() === '') {
                playNextInSequence();
            } else {
                speakForPlayAll(current.word, current.element, () => {
                    if (isPlaying) {
                        const isDelayed = document.getElementById('delayModeSelect').value === 'delayed';
                        const delayGap = isDelayed ? 1500 : 200;

                        playbackTimer = setTimeout(() => {
                            if (isPlaying) playNextInSequence();
                        }, delayGap);
                    }
                });
            }
        }

        function speakForPlayAll(text, cardElement, callback) {
            if (!text || text.trim() === '' || isEditMode) {
                if (callback) callback();
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'hi' ? 'hi-IN' : 'en-US';
            utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 0.8;

            const voice = currentLang === 'hi' ? selectedVoiceHindi : selectedVoiceEnglish;
            if (voice) {
                utterance.voice = voice;
            }

            currentUtterance = utterance;

            if (cardElement) {
                if (lastSpokenCard) lastSpokenCard.classList.remove('speaking');
                cardElement.classList.add('speaking');
                scrollToCardCenter(cardElement);
                lastSpokenCard = cardElement;
            }

            let executed = false;
            const done = () => {
                if (executed) return;
                executed = true;
                if (callback) callback();
            };

            const estimatedDuration = Math.max(500, (text.length * 350) / utterance.rate);
            const fallbackTimeout = setTimeout(done, estimatedDuration + 600);

            const safeDone = () => {
                clearTimeout(fallbackTimeout);
                done();
            };
            utterance.onend = safeDone;
            utterance.onerror = safeDone;

            window.speechSynthesis.speak(utterance);
        }

        function stopPlayback() {
            isPlaying = false;
            isPaused = false;
            if (playbackTimer) clearTimeout(playbackTimer);
            window.speechSynthesis.cancel();
            document.getElementById('playBtn').innerHTML = '▶️ Play All';
            document.getElementById('pauseBtn').innerHTML = '⏸️ Pause';
            if (lastSpokenCard) {
                lastSpokenCard.classList.remove('speaking');
                lastSpokenCard = null;
            }
            flatCards.forEach(c => {
                if (c.element) c.element.classList.remove('speaking');
            });
        }

        function toggleEditMode() {
            stopPlayback();
            isEditMode = !isEditMode;
            const btn = document.getElementById('modeToggleBtn');
            const clearBtn = document.getElementById('clearAllBtn');
            
            if (isEditMode) {
                btn.innerHTML = '💾 Save & View';
                btn.classList.add('btn-active');
                clearBtn.style.display = 'inline-flex';
            } else {
                btn.innerHTML = '✏️ Edit Mode: OFF';
                btn.classList.remove('btn-active');
                clearBtn.style.display = 'none';
            }
            renderGrid();
        }

        function clearAllWords() {
            for (let r = 0; r < wordData.length; r++) {
                for (let c = 0; c < 6; c++) {
                    wordData[r][c] = '';
                }
            }
            saveWords();
            renderGrid();
        }

        function generateRandomWords() {
            stopPlayback();
            let pool = [];

            if (currentLang === 'hi') {
                const selectedMatra = document.getElementById('matraSelect').value;
                pool = hindiDictionary[selectedMatra] || hindiDictionary.no_matra;
            } else {
                const selectedLength = document.getElementById('alphabetSelect').value;
                pool = englishDictionary[selectedLength] || englishDictionary[2];
            }

            let shuffled = [...pool].sort(() => 0.5 - Math.random());

            let wordIndex = 0;
            for (let r = 0; r < wordData.length; r++) {
                for (let c = 0; c < 6; c++) {
                    let w = shuffled[wordIndex % shuffled.length];
                    wordData[r][c] = (currentLang === 'en') ? w.toLowerCase() : w;
                    wordIndex++;
                }
            }

            saveWords();
            renderGrid();
        }

        function generateRhymingWords() {
            stopPlayback();
            const alphabetSelect = document.getElementById('alphabetSelect');
            if (currentLang !== 'en' || alphabetSelect.value !== '3') return;

            wordData = JSON.parse(JSON.stringify([
                ["cat", "bat", "rat", "mat", "hat", "fat"],
                ["not", "hot", "dot", "pot", "cot", "rot"],
                ["man", "pan", "ran", "van", "fan", "can"],
                ["sun", "bun", "fun", "run", "pun", "gun"],
                ["big", "dig", "fig", "pig", "wig", "jig"],
                ["jet", "net", "pet", "set", "wet", "vet"],
                ["mop", "pop", "top", "hop", "cop", "sop"],
                ["bin", "fin", "pin", "sin", "tin", "win"],
                ["den", "hen", "men", "pen", "ten", "zen"]
            ]));
            saveWords();
            renderGrid();
        }

        function addRow() {
            stopPlayback();
            wordData.push(["", "", "", "", "", ""]);
            saveWords();
            renderGrid();
        }

        function deleteLastRow() {
            stopPlayback();
            if (wordData.length <= 1) return;
            wordData.pop();
            saveWords();
            renderGrid();
        }

        function resetToDefault() {
            stopPlayback();
            wordData = JSON.parse(JSON.stringify(currentLang === 'hi' ? defaultWordsHindi : defaultWordsEnglish));
            saveWords();
            renderGrid();
        }

        window.onload = () => {
            initSpeech();
            updateLanguageUI();
            loadWords();
            renderGrid();
            checkRhymeButtonState();
        };
    </script>
</body>
</html>
